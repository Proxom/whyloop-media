  [8.1, 0, -23.5, -1, 134, 60, 184, 1.0],
  [9.2, 0, -11, -4, 262, 63, 190, 0.0],
  [12.2, 0, -11, -4, 256, 63, 186, 0.0],
  [13.2, 0, -23.5, -1, 138, 60, 180, 1.0],
  [14.4, 0, -23.5, -1, 136, 60, 178, 1.0],
  [15.8, 0, -24, -1, 216, 62, 182, 0.4],

function smooth(u) { return u * u * (3 - 2 * u); }

}
function setScene(t) {

  buildSpring([SEL[0] + pl.dir[0] * 1.2, SEL[1] + pl.dir[1] * 1.2], [pl.tip[0] - pl.dir[0] * 2.6, pl.tip[1] - pl.dir[1] * 2.6]);
  const c = camAt(t, k.phi); camera.position.copy(c.pos); camera.lookAt(c.target);

}
function scr(x, y, z, rot) { const v = new THREE.Vector3(x, y, z).applyAxisAngle(new THREE.Vector3(0, 0, 1), rot); v.project(camera); return [(v.x * 0.5 + 0.5) * W, (-v.y * 0.5 + 0.5) * H]; }
function leverScreen(k) { const a = k.pl.ang; const lx = 0, ly = -7.6; return scr(SEL[0] + Math.cos(a) * lx - Math.sin(a) * ly, SEL[1] + Math.sin(a) * lx + Math.cos(a) * ly, 2.4, k.phi); }
function noseScreen(k, side) { const n = KIN.rotP([side * 8.8, -8.8], k.db); return scr(n[0], n[1], 0.8, k.phi); }

// ---------- 2D overlay ----------
const out = document.getElementById('out'); const g2 = out.getContext('2d');
await document.fonts.load('120px Anton');
const win = (t, a, b, f = 0.15) => Math.max(0, Math.min(1, (t - a) / f, (b - t) / f));
function overlay(t, k) {
  const vg = g2.createRadialGradient(W / 2, H * 0.48, H * 0.28, W / 2, H * 0.5, H * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.42)'); g2.fillStyle = vg; g2.fillRect(0, 0, W, H);
  const tg = g2.createLinearGradient(0, 0, 0, 560); tg.addColorStop(0, 'rgba(8,6,4,0.55)'); tg.addColorStop(1, 'rgba(8,6,4,0)'); g2.fillStyle = tg; g2.fillRect(0, 0, W, 560);
  const hookA = Math.max(0, Math.min(1, (2.35 - t) / 0.15), Math.min(1, (t - 15.05) / 0.15));
  if (hookA > 0) drawHook(hookA, k);
  let a;
  if ((a = win(t, 3.3, 6.5)) > 0) { drawTurn(a, k, -1); drawLabel('TIGHTEN', a, null); }
  if ((a = win(t, 6.75, 8.0)) > 0) drawLabel('FLIP THE LEVER', a, leverScreen(k));
  if ((a = win(t, 9.1, 12.7)) > 0) { drawTurn(a, k, 1); drawLabel('LOOSEN', a, null); }
  if ((a = win(t, 13.05, 14.4)) > 0) drawLabel('OTHER SIDE', a, noseScreen(k, -1));
}
function drawTurn(a, k, dir) { // curved arrow around the socket showing the gear's turning direction
  g2.save(); g2.globalAlpha = a * 0.95; const pts = []; const R = 31, n = 60; const a0 = Math.PI / 2 - dir * Math.PI * 100 / 180;
  for (let i = 0; i <= n; i++) { const th = a0 + dir * (i / n) * Math.PI * 200 / 180; pts.push(scr(R * Math.cos(th), R * Math.sin(th), -8.0, 0)); }
  g2.lineCap = 'round'; g2.lineJoin = 'round'; g2.shadowColor = 'rgba(0,0,0,0.6)'; g2.shadowBlur = 10;
  g2.strokeStyle = '#ffd21f'; g2.lineWidth = 13; g2.beginPath(); pts.forEach((p, i) => i ? g2.lineTo(p[0], p[1]) : g2.moveTo(p[0], p[1])); g2.stroke();
  const e = pts[n], q = pts[n - 4]; const ang = Math.atan2(e[1] - q[1], e[0] - q[0]); g2.fillStyle = '#ffd21f'; g2.beginPath();
  g2.moveTo(e[0] + 30 * Math.cos(ang), e[1] + 30 * Math.sin(ang)); g2.lineTo(e[0] + 26 * Math.cos(ang + 2.2), e[1] + 26 * Math.sin(ang + 2.2)); g2.lineTo(e[0] + 26 * Math.cos(ang - 2.2), e[1] + 26 * Math.sin(ang - 2.2)); g2.closePath(); g2.fill();
  g2.restore();
}
function outlined(text, x, y, size, fill) {
  g2.font = `${size}px Anton`; g2.textAlign = 'center'; g2.textBaseline = 'alphabetic'; g2.lineJoin = 'round';
  g2.shadowColor = 'rgba(0,0,0,0.55)'; g2.shadowBlur = 18; g2.shadowOffsetY = 6;
  g2.lineWidth = size * 0.14; g2.strokeStyle = '#000'; g2.strokeText(text, x, y);
  g2.shadowColor = 'transparent'; g2.fillStyle = fill; g2.fillText(text, x, y);
}
function drawHook(a, k) {
  g2.save(); g2.globalAlpha = a;
  // badge
  g2.font = '40px Anton'; const bw = g2.measureText('INSIDE IT').width + 44; const bx = 495 - bw / 2, by = 330;
  g2.fillStyle = '#ffd21f'; roundRect(bx, by, bw, 58, 12); g2.fill(); g2.fillStyle = '#10141c'; g2.textAlign = 'center'; g2.fillText('INSIDE IT', 495, by + 45);
  outlined('ONE SWITCH.', 495, 500, 124, '#ffffff');
  outlined('BOTH WAYS?', 495, 628, 124, '#ffd21f');
  g2.font = '36px Anton'; g2.letterSpacing = '8px'; g2.lineWidth = 6; g2.strokeStyle = '#000'; g2.strokeText('WHYLOOP', 495, 692); g2.fillStyle = '#ffffff'; g2.fillText('WHYLOOP', 495, 692); g2.letterSpacing = '0px';
  // red circle around the pawl nose + arrow
  const [nx, ny] = leverScreen(k); const R = 70;
  g2.lineWidth = 9; g2.strokeStyle = '#ff2a2a'; g2.shadowColor = 'rgba(0,0,0,0.5)'; g2.shadowBlur = 10;
  g2.beginPath(); g2.arc(nx, ny, R, 0, Math.PI * 2); g2.stroke();
  // arrow from lower right
  const ax = nx - 300, ay = ny - 40, ex = nx - R - 6, ey = ny - 4;
  g2.lineWidth = 11; g2.lineCap = 'round'; const ux = (ex - ax), uy = (ey - ay), ul = Math.hypot(ux, uy); g2.beginPath(); g2.moveTo(ax, ay); g2.lineTo(ex - ux / ul * 26, ey - uy / ul * 26); g2.stroke();
  const ang = Math.atan2(ey - ay, ex - ax); g2.fillStyle = '#ff2a2a'; g2.beginPath(); g2.moveTo(ex, ey); g2.lineTo(ex - 40 * Math.cos(ang - 0.45), ey - 40 * Math.sin(ang - 0.45)); g2.lineTo(ex - 40 * Math.cos(ang + 0.45), ey - 40 * Math.sin(ang + 0.45)); g2.closePath(); g2.fill();
  g2.restore();
}
function drawLabel(text, a, p) {
  g2.save(); g2.globalAlpha = a; outlined(text, 495, 470, 96, '#ffd21f');
  if (p) { const [px, py] = p; if (py > 520 && py < 1440 && px > 60 && px < 930) { g2.strokeStyle = '#ffd21f'; g2.lineWidth = 6; g2.lineCap = 'round'; g2.shadowColor = 'rgba(0,0,0,0.6)'; g2.shadowBlur = 8; g2.beginPath(); g2.moveTo(495, 495); g2.lineTo(px, py - 18); g2.stroke(); g2.fillStyle = '#ffd21f'; g2.beginPath(); g2.arc(px, py, 11, 0, Math.PI * 2); g2.fill(); } }
  g2.restore();
}
function roundRect(x, y, w, h, r) { g2.beginPath(); g2.moveTo(x + r, y); g2.arcTo(x + w, y, x + w, y + h, r); g2.arcTo(x + w, y + h, x, y + h, r); g2.arcTo(x, y + h, x, y, r); g2.arcTo(x, y, x + w, y, r); g2.closePath(); }

window.motionPx = (t, fps = 30) => {
  const pts = (k) => { const P = [];
    const add = (x, y, z, rot) => { const v = new THREE.Vector3(x, y, z).applyAxisAngle(new THREE.Vector3(0, 0, 1), rot); v.project(camera); P.push([(v.x * 0.5 + 0.5) * W, (-v.y * 0.5 + 0.5) * H]); };
    for (let a = 0; a < 6; a++) add(14 * Math.cos(a), 14 * Math.sin(a), 0.6, k.thg);
    add(0, -215, 2, k.phi); add(0, -110, 2, k.phi); add(26, 0, 1.5, k.phi); add(-26, 0, 1.5, k.phi);
    for (const sd of [-1, 1]) { const n = KIN.rotP([sd * 8.8, -8.8], k.db); add(n[0], n[1], 0.7, k.phi); }

  return m;
};
window.renderFrame = (t, sub = 1, shutter = 0.5, fps = 30) => {
  g2.globalAlpha = 1; g2.clearRect(0, 0, W, H);
  let k;
  for (let i = 0; i < sub; i++) {
    const ts = t + (sub > 1 ? ((i + 0.5) / sub - 0.5) * shutter / fps : 0);
    k = setScene(ts); composer.render();
    g2.globalAlpha = 1 / (i + 1); g2.drawImage(renderer.domElement, 0, 0, W * SCALE, H * SCALE, 0, 0, W, H);
  }
  g2.globalAlpha = 1; k = setScene(t);
  overlay(((t % LOOP) + LOOP) % LOOP, k);
  return out.toDataURL('image/png');
};
window.ready = true;
