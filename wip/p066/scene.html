  if (t > EV.drop1 - 0.05 && t < EV.drop1 + 0.7) { const kk = 1 + 0.25 * Math.exp(-(t - EV.drop1) * 12); g2.save(); g2.globalAlpha = fade(t, EV.drop1 - 0.05, EV.drop1 + 0.7, 0.1); g2.translate(S.CX, 760); g2.scale(kk, kk); S.outlined(g2, 'CLICK!', 0, 0, 140, '#ffd21f'); g2.restore(); }
  S.caption(g2, fade(t, 40.3, 43.1), 'ALL 3 LINE UP: OPEN!', 440, 68, '#3ddc84');
  const ap = fade(t, 43.2, 46.2, 0.3); if (ap > 0) { g2.save(); g2.globalAlpha = ap; S.outlined(g2, 'EACH SPIN PICKS', S.CX, 520, 104, '#ffffff'); S.outlined(g2, 'UP ONE WHEEL', S.CX, 636, 104, '#ffd21f'); g2.restore(); }
  const af = fade(t, 45.9, 47.4, 0.25); if (af > 0) pill(g2, af, 'FOLLOW → A NEW MACHINE EVERY DAY', 1395, 44, 'rgba(12,14,20,0.8)', '#ffffff');
}
// ---------- frame harness with the loop dissolve (end pose -> the start pose) ----------
window.motionPx = (t) => 0;
window.renderFrame = (t, sub = 1, shutter = 0.5, fps = 30) => {
  const { g2, W, H, renderer, composer, P } = st; g2.setTransform(1, 0, 0, 1, 0, 0); g2.globalAlpha = 1; g2.clearRect(0, 0, W, H);
  setScene(Math.min(t, DIS0)); composer.render(); g2.drawImage(renderer.domElement, 0, 0, renderer.domElement.width, renderer.domElement.height, 0, 0, W, H);
  if (t > DIS0) { setScene(0); composer.render(); g2.globalAlpha = S.smooth((t - DIS0) / (LOOP - DIS0)); g2.drawImage(renderer.domElement, 0, 0, renderer.domElement.width, renderer.domElement.height, 0, 0, W, H); }
  g2.globalAlpha = 1; setScene(Math.min(t, DIS0)); S.overlayBegin(st); overlay(t); g2.fillStyle = 'rgba(255,255,255,0.004)'; g2.fillRect(0, 0, 1, 1);
  if (P.safe) S.safeZones(g2);
  return st.out.toDataURL('image/png');
};
await document.fonts.load('40px Anton');
window.ready = true;
