<script type="module">

  const gs = new THREE.Shape(); gs.moveTo(G.BL_R0 + 3, -1.6); for (let x = G.BL_R0 + 3; x <= R1 - 8; x += 1) gs.lineTo(x, -1.6 + 1.1 * Math.sin(x * 0.55)); gs.lineTo(R1 - 8, 2.3); gs.lineTo(G.BL_R0 + 3, 2.3); gs.closePath();

const BTN = new THREE.Group(); SW.add(BTN);
add(new THREE.Mesh(new THREE.CylinderGeometry(4.9, 4.9, 8.5, 40), M.btn), BTN).position.y = (2 + 9.5) / 2 + 0.5 - 1;
{ const cap = add(new THREE.Mesh(new THREE.CylinderGeometry(4.6, 4.9, 0.8, 40), M.btn), BTN); cap.position.y = 9.6; }
const LEGS = []; for (const sx of [1, -1]) { const l = add(new THREE.Mesh(new THREE.BoxGeometry(2.9, 6, G.LEG_W), M.leg), BTN); l.position.set(sx * 6.45, 4, 0); LEGS.push(l); }
const RING = add(new THREE.Mesh(new THREE.TorusGeometry(5.6, 0.45, 12, 48), M.chrome), PIV); RING.rotation.x = Math.PI / 2; RING.position.y = 8.1;

const TLEG = add(new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 4.2, 12), M.chrome), SW); TLEG.position.set(-6.6, -1.6, 0.6);
const RSP = K.spring(M.steel, { R: 3, wire: 0.42, turns: 3, len: 6 }); RSP.position.y = -6.5; PIV.add(RSP);
S.shadowAll(scene);
K.backdrop(scene, { floorY: -8.2, R: 160, zBack: -900, h: 4000, width: 8000, wall: '#2a3140', floor: '#2b3038', pool: true, catcher: 3000, shadowOpacity: 0.55 });
K.contactBlob(scene, -30, -8.2, -5, 48, 0.45);
const RIG = K.lightRig(scene, V(-10, 0, 5), 120, { key: 2.6, rim: 2.6, fill: 0.5 }); RIG.key.shadow.bias = -0.0004;
{ const f = new THREE.DirectionalLight(0xfff1e0, 0.8); f.position.set(200, 500, 600); scene.add(f); const g = new THREE.DirectionalLight(0xcfe0ff, 1.2); g.position.set(-500, 300, -400); scene.add(g); }
// ---------- kinematics ----------
const DT = 1 / G.FPS_K;
function kin(t) { t = Math.max(0, Math.min(LOOP - 1e-6, t)); const i = Math.min(KN.length - 2, Math.floor(t / DT)), u = (t - KN[i][0]) / DT; const a = KN[i], b = KN[i + 1];
  if (Math.abs(b[1] - a[1]) > 20) return a; return a.map((v, j) => j >= 4 ? a[j] : v + (b[j] - v) * u); }
const hard = (t, a, b) => (t >= a && t < b) ? 1 : 0;
const inside = (t) => t >= T.cutIn && t < T.outA;
let KK = null;
function setScene(t) {
  const k = KK = kin(t); const th = k[1], b = k[2];
  SW.rotation.y = -th * D2R; BTN.position.y = -b; RSP.setLength(7.5 - b);
  TSP.rotation.y = -th * D2R * 0.35;
  const ins = inside(t); FULL.visible = !ins; CUT.visible = ins;
  const wound = (k[3] - 60) / 180;                                   // 1 folded (wound) .. 0 open
  K.glow(TSP, ins && t < T.snapB + 0.2 && t > T.vo1 + 0.4 ? 0.35 + 0.65 * wound : 0);
  K.glow(LEGS[0], ins && t >= T.vo2 + 0.6 && t < T.vo4 ? 1 : (ins && t >= T.pop - 0.1 && t < T.outA ? 1 : 0)); K.glow(LEGS[1], ins && t >= T.vo2 + 0.6 && t < T.vo4 ? 1 : (ins && t >= T.pop - 0.1 && t < T.outA ? 1 : 0));
  K.shoot(st, CAMK, t);
}
// ---------- camera keys [t, tx, ty, tz, dist, elev, azim] ----------
const k_ = (t, a) => [t, ...a];
const OUTK = (d = 330, az = 18, el = 40, tx = -6) => [tx, 26, 4, d, el, az];
const INK = (d = 118, az = 24, el = 24) => [0, 2.5, 12, d, el, az];
const WIDE = (d = 300, az = 10, el = 58) => [2, 20, 30, d, el, az];
const CAMK = [k_(0, OUTK(330, 16)), k_(T.cutIn - 0.01, OUTK(300, 22)),
  k_(T.cutIn, INK(150, 30, 28)), k_(T.vo2 - 0.01, INK(128, 22, 24)), k_(T.vo2, INK(112, 30, 22)), k_(T.vo3 - 0.01, INK(98, 36, 20)),
  k_(T.vo3, INK(104, 26, 26)), k_(T.vo4 + 0.4, INK(116, 22, 30)), k_(T.vo4 + 0.7, WIDE(300, 12, 58)), k_(T.vo5 - 0.01, WIDE(290, 4, 60)),
  k_(T.vo5, INK(110, -26, 24)), k_(T.outA - 0.01, INK(96, -32, 22)),
  k_(T.outA, OUTK(300, -14, 42)), k_(LOOP, OUTK(330, 16))];
// ---------- overlay ----------
const sp = (x, y, z) => S.toScreen(camera, V(x, y, z));
const pw = (x, y, z) => S.toScreen(camera, PIV.localToWorld(V(x, y, z)));

  g2.shadowColor = 'rgba(0,0,0,0.55)'; g2.shadowBlur = 14; g2.fillStyle = color; g2.strokeStyle = '#1c0f00'; g2.lineWidth = 5; g2.beginPath(); g2.moveTo(0, -w / 2); g2.lineTo(L - w * 2, -w / 2); g2.lineTo(L - w * 2, -w * 1.25); g2.lineTo(L, 0); g2.lineTo(L - w * 2, w * 1.25); g2.lineTo(L - w * 2, w / 2); g2.lineTo(0, w / 2); g2.closePath(); g2.stroke(); g2.fill(); g2.restore(); }
function arcArrow(g2, a, cx, cy, R, a0, a1, color) { if (a <= 0) return; g2.save(); g2.globalAlpha = a; g2.strokeStyle = color; g2.lineWidth = 14; g2.lineCap = 'round'; g2.shadowColor = 'rgba(0,0,0,0.6)'; g2.shadowBlur = 10;
  g2.beginPath(); g2.ellipse(cx, cy, R, R * 0.55, 0, a0, a1, a1 < a0); g2.stroke(); const ex = cx + R * Math.cos(a1), ey = cy + R * 0.55 * Math.sin(a1); const dir = a1 > a0 ? 1 : -1;

  g2.fillStyle = color; g2.beginPath(); g2.moveTo(ex + ux * 30, ey + uy * 30); g2.lineTo(ex - uy * 22, ey + ux * 22); g2.lineTo(ex + uy * 22, ey - ux * 22); g2.closePath(); g2.fill(); g2.restore(); }
function overlay(t) {
  const g2 = st.g2; S.vignette(g2, 0); const k = KK || kin(t);
  { let fx = 0; for (const c of [T.cutIn, T.vo4 + 0.55, T.vo5, T.outA]) fx = Math.max(fx, 1 - Math.abs(t - c) / 0.1); K.TXT.flash(g2, 0.6 * Math.max(0, fx)); }
