  const apy = fade(t, 20.0, 23.0, 0.3); if (apy > 0) { g2.save(); g2.globalAlpha = apy; S.outlined(g2, 'SPRINGS FEEL THE WEIGHT', S.CX, 520, 80, '#ffffff'); S.outlined(g2, 'THE GEAR READS IT', S.CX, 620, 96, '#ffd21f'); g2.restore(); }
  pill(g2, fade(t, 23.2, 24.6, 0.25), 'FOLLOW → A NEW MACHINE EVERY DAY', 1395, 44, '#ffffff');
}
