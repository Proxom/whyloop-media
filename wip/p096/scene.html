<script type="module">

  p.lineTo(x + w - r, y + h); p.absarc(x + w - r, y + h - r, r, Math.PI / 2, 0, true); p.lineTo(x + w, y + r); p.absarc(x + w - r, y + r, r, 0, -Math.PI / 2, true); p.lineTo(x + r, y); return p; }

const midShape = rr(W + 10, H + 10, R + 5); { const h = new THREE.Path(); h.absarc(0, G.HOLE_Y, G.HOLE_R, 0, Math.PI * 2, true); midShape.holes.push(h); }

// rubber seal holding outer + middle, fuselage skin, cabin wall panel + window bezel (reveal)
{ const s = rr(W + 70, H + 70, R + 35); s.holes.push(rrPath(W + 4, H + 4, R + 2)); ext(s, G.OUT[0] - 4, G.MID[1] + 4, M.seal, 2); }
{ const s = rr(1400, 1600, 40); s.holes.push(rrPath(W + 60, H + 60, R + 30)); ext(s, G.SKIN[0], G.SKIN[1], M.skin, 1.5); }
{ const s = rr(1000, 1300, 60); s.holes.push(rrPath(W + 90, H + 90, R + 45)); ext(s, G.PANEL[1] - 8, G.PANEL[1], M.panel, 2); }
{ const s = rr(W + 92, H + 92, R + 46); s.holes.push(rrPath(W + 6, H + 6, R + 3)); ext(s, G.MID[1] + 6, G.PANEL[1] - 2, M.bezel, 3); }
// sky behind (front view)
{ const c = document.createElement('canvas'); c.width = 512; c.height = 1024; const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 1024);
  gr.addColorStop(0, '#2f6fc4'); gr.addColorStop(0.55, '#7fb2e8'); gr.addColorStop(0.75, '#e9eef5'); gr.addColorStop(1, '#f6f2ea'); g.fillStyle = gr; g.fillRect(0, 0, 512, 1024);
  for (let i = 0; i < 26; i++) { const x = (i * 97) % 512, y = 700 + (i * 53) % 220, r = 40 + (i * 31) % 70; const cg = g.createRadialGradient(x, y, 0, x, y, r); cg.addColorStop(0, 'rgba(255,255,255,0.9)'); cg.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = cg; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; const m = new THREE.Mesh(new THREE.PlaneGeometry(3200, 4200), new THREE.MeshBasicMaterial({ map: t, toneMapped: false })); m.position.set(0, -840, -1800); scene.add(m); }
// section caps at x = 0 (shown when the cut is complete): solid parts red, acrylic panes pale blue
const CAPS = new THREE.Group(); scene.add(CAPS);
const capBox = (y0, y1, z0, z1, mat) => { const m = new THREE.Mesh(new THREE.BoxGeometry(1.2, y1 - y0, z1 - z0), mat); m.position.set(0.7, (y0 + y1) / 2, (z0 + z1) / 2); CAPS.add(m); return m; };
capBox(-(H + 20) / 2 + 1, (H + 20) / 2 - 1, G.OUT[0], G.OUT[1], M.glassCap);
capBox(-(H + 10) / 2 + 1, G.HOLE_Y - G.HOLE_R, G.MID[0], G.MID[1], M.glassCap); capBox(G.HOLE_Y + G.HOLE_R, (H + 10) / 2 - 1, G.MID[0], G.MID[1], M.glassCap);
capBox(-H / 2 + 1, H / 2 - 1, G.INN[0], G.INN[1], M.glassCap);
for (const sg of [-1, 1]) { capBox(sg > 0 ? (H + 4) / 2 : -(H + 70) / 2, sg > 0 ? (H + 70) / 2 : -(H + 4) / 2, G.OUT[0] - 4, G.MID[1] + 4, M.cap);
  capBox(sg > 0 ? (H + 60) / 2 : -800, sg > 0 ? 800 : -(H + 60) / 2, G.SKIN[0], G.SKIN[1], M.cap);
  capBox(sg > 0 ? (H + 90) / 2 : -650, sg > 0 ? 650 : -(H + 90) / 2, G.PANEL[1] - 8, G.PANEL[1], M.cap);
  capBox(sg > 0 ? (H + 6) / 2 : -(H + 92) / 2, sg > 0 ? (H + 92) / 2 : -(H + 6) / 2, G.MID[1] + 6, G.PANEL[1] - 2, M.cap); }
S.shadowAll(scene); for (const m of [OUTER, MIDDLE, INNER]) m.castShadow = false;
const RIG = K.lightRig(scene, V(0, 0, -50), 420, { key: 2.2, rim: 2.4, fill: 0.5 }); RIG.key.shadow.bias = -0.0004;
{ const f = new THREE.DirectionalLight(0xfff1e0, 1.0); f.position.set(900, 400, 1400); scene.add(f); const s2 = new THREE.DirectionalLight(0xcfe3ff, 1.2); s2.position.set(300, 600, -1600); scene.add(s2);
  const f3 = new THREE.DirectionalLight(0xffffff, 0.8); f3.position.set(1600, 200, 100); scene.add(f3); }
// ---------- timeline ----------
const fade = (t, a, b, f = 0.15) => Math.min(S.smooth((t - a) / f), 1 - S.smooth((t - b + f) / f));
const hard = (t, a, b) => (t >= a && t < b) ? 1 : 0;
function cutAt(t) { if (t < T.orbA + 0.15) return 400; if (t < T.orbB) return 400 * (1 - S.smooth((t - T.orbA - 0.15) / (T.orbB - T.orbA - 0.25))); if (t < T.back) return 0;
  if (t < T.backB) return 400 * S.smooth((t - T.back) / (T.backB - T.back - 0.1)); return 400; }
// camera keys [t, tx, ty, tz, dist, elev, azim]
const FRONT0 = [0, -10, -60, 1500, 6, 0], FRONT1 = [0, -40, -60, 1220, 5, 0];
const SIDE = (ty, tz, d, el = 4, az = 90) => [0, ty + 10, tz, d * 0.9, el + 4, az - 16];
const k_ = (t, a) => [t, ...a];
const CAMK = [k_(0, FRONT0), k_(T.orbA, FRONT1), k_(T.orbB, SIDE(-10, -45, 1450, 5, 88)), k_(T.vo2 - 0.01, SIDE(-10, -40, 1420, 4, 90)),
  k_(T.vo3 - 0.1, SIDE(-10, -20, 1340, 4, 92)), k_(T.fill + 1.0, SIDE(-105, -50, 760, 4, 90)), k_(T.vo4, SIDE(-95, -50, 820, 4, 89)),
  k_(T.load - 0.2, SIDE(-10, -55, 1330, 5, 90)), k_(T.wet - 0.05, SIDE(-10, -60, 1300, 4, 91)), k_(T.wet + 0.6, SIDE(-70, -55, 1000, 4, 90)),
  k_(T.back, SIDE(-60, -50, 1080, 5, 89)), k_(T.backB, FRONT1), k_(LOOP, FRONT0)];
function setScene(t) {
  const c = cutAt(t); PL.constant = c; CAPS.visible = c < 1;
  K.glow(OUTER, hard(t, T.load, T.backup + 1.6) * 0.0); // acrylic keeps its look; the load is shown with arrows
  K.shoot(st, CAMK, t);
}
// ---------- overlay ----------
const sp = (y, z, x = 2) => S.toScreen(camera, V(x, y, z));
function arrowC(g2, a, x0, y0, x1, y1, w, color) { if (a <= 0) return; g2.save(); g2.globalAlpha = a; const ang = Math.atan2(y1 - y0, x1 - x0), L = Math.hypot(x1 - x0, y1 - y0); g2.translate(x0, y0); g2.rotate(ang);
  g2.shadowColor = 'rgba(0,0,0,0.55)'; g2.shadowBlur = 14; g2.fillStyle = color; g2.strokeStyle = '#1c0f00'; g2.lineWidth = 5; g2.beginPath(); g2.moveTo(0, -w / 2); g2.lineTo(L - w * 2, -w / 2); g2.lineTo(L - w * 2, -w * 1.25); g2.lineTo(L, 0); g2.lineTo(L - w * 2, w * 1.25); g2.lineTo(L - w * 2, w / 2); g2.lineTo(0, w / 2); g2.closePath(); g2.stroke(); g2.fill(); g2.restore(); }
const HF = G.MID[1] + 3, HB = G.MID[0] - 3;
function pathAt(p, u) { let a, b, v;
  if (u < 0.3) { v = u / 0.3; a = p.start; b = [G.HOLE_Y, HF]; } else if (u < 0.45) { v = (u - 0.3) / 0.15; a = [G.HOLE_Y, HF]; b = [G.HOLE_Y, HB]; } else { v = (u - 0.45) / 0.55; a = [G.HOLE_Y, HB]; b = p.end; }
  return [a[0] + (b[0] - a[0]) * v, a[1] + (b[1] - a[1]) * v]; }
function wetAt(p, u) { let a, b, v;
  if (u < 0.6) { v = u / 0.6; a = p.start; b = [G.HOLE_Y, HB]; } else if (u < 0.75) { v = (u - 0.6) / 0.15; a = [G.HOLE_Y, HB]; b = [G.HOLE_Y, HF]; } else { v = (u - 0.75) / 0.25; a = [G.HOLE_Y, HF]; b = p.end; }
  return [a[0] + (b[0] - a[0]) * v, a[1] + (b[1] - a[1]) * v]; }
function dot(g2, x, y, r, fill, a = 1) { g2.save(); g2.globalAlpha = a; g2.fillStyle = fill; g2.strokeStyle = 'rgba(10,20,40,0.85)'; g2.lineWidth = 3; g2.beginPath(); g2.arc(x, y, r, 0, 7); g2.fill(); g2.stroke(); g2.restore(); }
// cabin air dots (between inner and middle pane + in the cabin): fixed jittered grid, gently moving
const CAB = []; for (let i = 0; i < 44; i++) CAB.push([-150 + (i % 11) * 30 + ((i * 7) % 5), -40 + Math.floor(i / 11) * 13 + ((i * 3) % 4)]);
function overlay(t) {
  const g2 = st.g2; S.vignette(g2, 0); const side = t >= T.orbB - 0.1 && t < T.back + 0.2;
  { let fx = 0; for (const c of [T.hookEnd]) fx = Math.max(fx, 1 - Math.abs(t - c) / 0.1); K.TXT.flash(g2, 0.6 * Math.max(0, fx)); }
  // hook (front view): breathing rings at the hole = the payoff (air passes through it)
  const [hx, hy] = S.toScreen(camera, V(0, G.HOLE_Y, G.MID[1]));
  if (t < T.orbA) { for (let r = 0; r < 3; r++) { const ph = ((t * 0.9 + r / 3) % 1); g2.save(); g2.globalAlpha = (1 - ph) * 0.9; g2.strokeStyle = '#9fe0ff'; g2.lineWidth = 6; g2.beginPath(); g2.arc(hx, hy, 10 + ph * 70, 0, 7); g2.stroke(); g2.restore(); }

  K.TXT.step(g2, s2, 2, 'UP HIGH: CABIN AIR PUSHES OUT', 54);
  K.TXT.step(g2, s3, 3, 'THE HOLE LETS CABIN AIR IN', 56);
  K.TXT.step(g2, s4, 4, t < T.load ? 'SAME PUSH ON BOTH SIDES' : 'ONLY THE OUTER PANE TAKES IT', 54);

    // step 1: one pane label at a time

      S.tag(g2, a(T.vo1 + 1.25), 'MIDDLE', ...sp(-20, (G.MID[0] + G.MID[1]) / 2), 150, 40, 48, '#ffffff');
      S.tag(g2, a(T.vo1 + 1.8), 'OUTER', ...sp(-90, (G.OUT[0] + G.OUT[1]) / 2), -150, 120, 48, '#ffffff'); }

    if (s2) { for (const y of [-90, 20, 120]) { const [x0, y0] = sp(y, 110), [x1] = sp(y, 30); arrowC(g2, 1, x0, y0, x1, y0, 22, '#ffd21f'); } }

      S.tag(g2, hard(t, T.load + 0.3, T.vo5), 'OUTER PANE: FULL LOAD', ...sp(-150, (G.OUT[0] + G.OUT[1]) / 2), -60, 300, 48, '#ffd21f');
      S.tag(g2, hard(t, T.backup, T.vo5), 'MIDDLE PANE: BACKUP', ...sp(150, (G.MID[0] + G.MID[1]) / 2), 120, -150, 48, '#7cff9a'); }

  }
