<script type="importmap">{"imports":{"three":"/tools/render/node_modules/three/build/three.module.js","three/addons/":"/tools/render/node_modules/three/examples/jsm/"}}</script>

<script type="module">
// p054 zip tie: why does a zip tie only go one way? mm units. x-y = the plane the tie lies in (bench under it at z<0), z = tape width.
// The tail tape runs along +y through the head; its teeth face -x; the orange pawl is hinged on the slot's -x wall.
import * as S from '/tools/render/lib/studio.js';
const THREE = S.THREE;
const geo = await (await fetch('geom.json')).json();
const kinT = await (await fetch('kin_240.json')).json();
const LOOP = geo.LOOP, P = geo.P, H = geo.H, T = geo.T, ZW = 2.4;

const st = S.makeStudio({ fov: 32, bg: 0x0b0e14, envIntensity: 0.8, bloom: 0, near: 1, far: 3000, samples: 0 });
st.renderer.toneMappingExposure = 0.9;
const { scene, camera } = st;
const { shapeOf, extrude } = S;

// ---------- materials ----------
const grain = S.noiseTex(3, 150, 14, 256); grain.repeat.set(0.25, 0.25);
const M = {
  nylon: new THREE.MeshPhysicalMaterial({ color: 0xeee6d3, roughness: 0.42, roughnessMap: grain, metalness: 0, clearcoat: 0.25, clearcoatRoughness: 0.3, sheen: 0.4, sheenColor: 0xfff4e0 }),
  tape: new THREE.MeshPhysicalMaterial({ color: 0xe9dfc8, roughness: 0.45, metalness: 0, clearcoat: 0.2, clearcoatRoughness: 0.35 }),
  cut: new THREE.MeshStandardMaterial({ color: 0x4e5866, roughness: 0.55, metalness: 0 }),
  pawl: new THREE.MeshPhysicalMaterial({ color: 0xff5a0a, metalness: 0.0, roughness: 0.32, clearcoat: 0.9, clearcoatRoughness: 0.08 }),
  cover: new THREE.MeshPhysicalMaterial({ color: 0xeee6d3, roughness: 0.42, roughnessMap: grain, metalness: 0, clearcoat: 0.25, clearcoatRoughness: 0.3, side: THREE.DoubleSide, clippingPlanes: [] }),
};
const coverPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 100); M.cover.clippingPlanes = [coverPlane];
M.cover.onBeforeCompile = (sh) => { sh.fragmentShader = sh.fragmentShader.replace('#include <dithering_fragment>', '#include <dithering_fragment>\n if(!gl_FrontFacing) gl_FragColor.rgb = vec3(0.16,0.18,0.22);'); };

// ---------- tail tape (moves along y) ----------
function tapeShape(y0, y1, teethSide = -1) {
  const pts = [[T, y0]]; const k0 = Math.ceil(y0 / P), k1 = Math.floor(y1 / P);
  pts.push([0, y0]);
  for (let k = k0; k <= k1; k++) { pts.push([0, k * P - 0.0005]); pts.push([-H, k * P]); }
  pts.push([0, y1]); pts.push([T, y1]);
  return pts.reverse();
}
const tapeG = new THREE.Group(); scene.add(tapeG);
{ const m = extrude(shapeOf(tapeShape(-40 * P / 1.6 * 1.6 - 0.0, 25.6)), -ZW, ZW, [M.tape, M.tape], 0.0, 4); tapeG.add(m);
  // tip of the tail far below is off frame; nothing else on the tape
}
// ---------- head: two extruded core parts (cut faces dark red when the cover is open) + front/back cover plates ----------
const headG = new THREE.Group(); scene.add(headG);
for (const ring of geo.head) headG.add(extrude(shapeOf(ring.slice().reverse())  , -2.46, 2.46, [M.cut, M.nylon], 0.0, 4));
const [X0, YB, X1, YT] = geo.headBox;
const rr = S.roundRect(X0, YB, X1, YT, 0.45).reverse();
const coverF = extrude(shapeOf(rr), 2.5, 3.2, [M.cover, M.cover], 0.12, 8); headG.add(coverF);
const coverB = extrude(shapeOf(rr), -3.2, -2.5, [M.nylon, M.nylon], 0.12, 8); headG.add(coverB);
// attached strap: leaves the head's left face (it is the tie's own strap), teeth on its underside (inside of the loop)
{ const pts = [[X0 + 0.3, YB + 1.3], [-46, YB + 1.3], [-46, YB]];
  for (let k = Math.floor(-46 / P); k <= Math.floor((X0 + 0.2) / P); k++) { const x = k * P; if (x < -46 || x > X0 + 0.2) continue; pts.push([x, YB]); pts.push([x + 0.0005, YB - 0.55]); }
  pts.push([X0 + 0.3, YB]);
  const m = extrude(shapeOf(pts.reverse()), -ZW, ZW, [M.tape, M.tape], 0.0, 4); headG.add(m); }
// pawl (hinged at R on the -x wall)
const pivot = new THREE.Group(); pivot.position.set(geo.R[0], geo.R[1], 0); headG.add(pivot);
{ const loc = geo.pawlVis.map(p => [p[0] - geo.R[0], p[1] - geo.R[1]]); const m = extrude(shapeOf(loc.slice().reverse()), -2.38, 2.38, [M.pawl, M.pawl], 0.0, 4); pivot.add(m); }
// bench + dark backdrop
const bench = S.bench(scene, -3.24, 'z', 600, 1); bench.material.map.repeat.set(0.35, 0.35); bench.material.color = new THREE.Color(0x6a5e55);
S.shadowAll(scene); bench.castShadow = false;
// ---------- lights ----------
const key = new THREE.DirectionalLight(0xfff0dc, 2.0); key.position.set(-60, 70, 120); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); { const c = key.shadow.camera; c.left = -30; c.right = 30; c.top = 30; c.bottom = -30; c.near = 60; c.far = 260; } key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02; key.shadow.radius = 3;
scene.add(key, key.target);
const rim = new THREE.DirectionalLight(0xcfe0ff, 1.6); rim.position.set(90, 40, 30); scene.add(rim);
scene.add(new THREE.HemisphereLight(0xdde6ff, 0x2a2420, 0.25));
const fill = new THREE.DirectionalLight(0xfff0e0, 0.5); fill.position.set(-40, -60, 90); scene.add(fill);

// ---------- animation ----------
function kinAt(t) { t = ((t % LOOP) + LOOP) % LOOP; const f = t * 240; const i = Math.floor(f), u = f - i; const A = kinT[i % kinT.length], B = kinT[(i + 1) % kinT.length];
  let dY = B.Y - A.Y; if (i + 1 >= kinT.length) dY = 0; return { Y: A.Y + dY * u, th: A.th + (B.th - A.th) * u }; }
// camera keys [t, tx, ty, tz, dist, elev, azim]
const TIP = [-0.1, 1.0, 2.4];
const KEYS = [
  [0.0, -0.9, 1.0, 0, 54, -16, -20],
  [2.7, -0.9, 1.0, 0, 51, -16, -18],
  [4.2, -0.6, 0.6, 1.0, 36, -12, -12],
  [4.7, -0.35, 1.55, 2.0, 23, -10, -8],
  [6.9, -0.35, 1.55, 2.0, 22, -10, -8],
  [8.9, -0.35, 1.55, 2.0, 23, -10, -8],
  [9.9, -0.6, 0.6, 1.0, 36, -12, -12],
  [11.0, -0.9, 1.0, 0, 53, -16, -20],
  [13.0, -0.9, 1.0, 0, 54, -16, -20],
];
const coverCut = (t) => { // cover clip height: 100 = closed; sweeps top -> bottom to open (3.0-4.1), back 10.0-10.9
  const u = t < 3.0 ? 0 : t < 4.1 ? S.smooth((t - 3.0) / 1.1) : t < 10.0 ? 1 : t < 10.9 ? 1 - S.smooth((t - 10.0) / 0.9) : 0;
  return u <= 0 ? 100 : YT + 0.3 - u * (YT - YB + 0.6) - (u >= 1 ? 50 : 0); };
let shake = 0;
function setScene(t) { const tt = ((t % LOOP) + LOOP) % LOOP; const k = kinAt(tt);
  tapeG.position.y = geo.Y0 + k.Y; pivot.rotation.z = k.th;
  coverPlane.constant = coverCut(tt); coverF.visible = coverPlane.constant > YB - 0.5;
  const c = S.orbitCam(KEYS, tt, LOOP);
  // tiny jolt on the lock and the second tug
  const j = (t0) => (tt > t0 && tt < t0 + 0.25) ? Math.exp(-(tt - t0) * 18) * Math.sin((tt - t0) * 70) : 0;
  shake = 0.05 * (j(7.306) + 0.6 * j(8.0));
  camera.position.copy(c.pos); camera.lookAt(c.target); camera.position.y += shake; camera.updateMatrixWorld(); return k; }
const scr = (x, y, z) => S.toScreen(camera, new THREE.Vector3(x, y, z));
const tipScr = (k) => { const c = Math.cos(k.th), s = Math.sin(k.th); const vx = 0 - geo.R[0], vy = geo.tipY - geo.R[1]; return scr(geo.R[0] + c * vx - s * vy, geo.R[1] + s * vx + c * vy, 2.4); };
const midPawl = (k) => { const c = Math.cos(k.th), s = Math.sin(k.th); const vx = -0.9 - geo.R[0], vy = -0.3 - geo.R[1]; return scr(geo.R[0] + c * vx - s * vy, geo.R[1] + s * vx + c * vy, 2.4); };

// ---------- overlay ----------
await document.fonts.load('120px Anton');
const g2 = st.g2;
const win = (t, a, b, f = 0.18) => Math.max(0, Math.min(1, (t - a) / f, (b - t) / f));
function overlay(t, k) {
  S.vignette(g2, 560);
  const hookA = Math.max(0, Math.min(1, (2.4 - t) / 0.18), Math.min(1, (t - 12.82) / 0.18));
  if (hookA > 0) { g2.save(); g2.globalAlpha = hookA * 0.55; const gr = g2.createRadialGradient(S.CX, 560, 40, S.CX, 560, 420); gr.addColorStop(0, 'rgba(0,0,0,0.85)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g2.fillStyle = gr; g2.fillRect(0, 300, 1080, 560); g2.restore();
    S.hookCard(g2, hookA, 'WHY ONLY', 'ONE WAY?', 118); const [x, y] = scr(-0.6, -0.3, 3.2); S.redCircle(g2, hookA, x, y, 92, [-250, 190]); }
  let a;
  // pull arrows beside the tail above the head
  const ax = scr(T + 0.9, YT + 2.0, 2.4)[0] + 60, ay0 = scr(T, YT + 1.2, 2.4)[1], ay1 = scr(T, YT + 5.5, 2.4)[1];
  const pullA = (t > 0.05 && t < 2.4) || (t > 4.55 && t < 6.85) || (t > 11.0 && t < 12.85) ? 1 : 0;
  if (pullA && t > 2.4) S.forceArrow(g2, 0.9, Math.min(900, ax), Math.max(ay0, 700), Math.min(900, ax), Math.max(ay1, 560), 22);
  if ((a = win(t, 3.3, 4.5)) > 0) { const p = midPawl(k); S.label(g2, a, 'INSIDE: A PAWL', p[0], p[1], 1390, 88); }
  if ((a = win(t, 4.7, 6.85)) > 0) S.label(g2, a, 'PULL: IT SLIDES OVER', null, null, 1390, 80);
  if ((a = win(t, 7.0, 8.75)) > 0) { S.label(g2, a, t < 7.3 ? 'PULL BACK…' : 'LOCKED', null, null, 1390, 104); if (t > 7.3) { const p = tipScr(k); S.redCircle(g2, Math.min(a, (t - 7.3) / 0.1), p[0], p[1], 64, [-200, 170]); } }
  if (t > 7.1 && t < 7.42 || t > 7.95 && t < 8.18) { const p = scr(T + 0.7, 3.5, 2.4); S.forceArrow(g2, 0.9, Math.min(900, p[0] + 40), 700, Math.min(900, p[0] + 40), 880, 22); }
  if ((a = win(t, 8.9, 10.4)) > 0) S.label(g2, a, 'TEETH SLOPE ONE WAY', null, null, 1390, 80);
  if ((a = win(t, 11.2, 12.72)) > 0) { g2.save(); g2.globalAlpha = a; S.outlined(g2, 'FOLLOW → NEW MACHINE TOMORROW', S.CX, 1400, 56, '#ffffff'); g2.restore(); }
}
window._st = st; window._set = setScene; window._kin = kinAt; window._scr = scr;
S.install(st, setScene, (t) => overlay(((t % LOOP) + LOOP) % LOOP, kinAt(t)));
window.motionPx = (t, fps = 30) => { const pts = () => { const k = kinAt(t); return [tipScr(k), scr(T, 4 + geo.Y0 + k.Y, 2.4)]; };
  setScene(t); const A = pts(); setScene(t + 1 / fps); const B = pts(); let m = 0; for (let i = 0; i < A.length; i++) m = Math.max(m, Math.hypot(A[i][0] - B[i][0], A[i][1] - B[i][1])); return m; };
</script></body></html>
