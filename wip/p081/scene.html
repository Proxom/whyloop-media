<script type="module">
// p081 prism pencil sharpener "HOW DOES IT MAKE / A PERFECT POINT?" (group E, track A voice). Built from kit/kit.js.
// mm, pencil axis = y (tip down). Clear plastic body so the shaping cone and the blade are visible.
// kin.json rows: [t, pencil end ye, pencil turn angle, hook lift, cut fraction]
import * as K from '/kit/kit.js';
const { THREE, S } = K;
const G = await (await fetch('geom.json')).json();

const LOOP = G.LOOP, T = G.T;
const st = K.makeKit({ fov: 30, bg: 0x15171b, envIntensity: 1.05, near: 1, far: 20000 });

const M = K.materials();
const phys = (o) => new THREE.MeshPhysicalMaterial(o);

// materials
const woodTex = (() => { const c = document.createElement('canvas'); c.width = 256; c.height = 1024; const g = c.getContext('2d'); const r = S.rng(81);
  g.fillStyle = '#d9a873'; g.fillRect(0, 0, 256, 1024); for (let i = 0; i < 70; i++) { g.strokeStyle = `rgba(${150 + r() * 40 | 0},${95 + r() * 30 | 0},${55 + r() * 20 | 0},${0.25 + r() * 0.35})`; g.lineWidth = 1 + r() * 3; const x = r() * 256; g.beginPath(); g.moveTo(x, 0); g.bezierCurveTo(x + 8, 300, x - 8, 700, x + 4, 1024); g.stroke(); }

{ const f = new THREE.DirectionalLight(0xfff1e0, 0.5); f.position.set(-200, 300, 800); scene.add(f); }

  const b = S.extrude(S.shapeOf(ring), -G.BODY_Z, G.BODY_Z, M.body, 1.0, 4); b.renderOrder = 5; scene.add(b);
  const prof = [[G.R_EXIT, G.BODY_Y0], [G.R_BORE, G.Y_CONE_TOP], [G.R_BORE, G.BODY_Y1]];
  const cone = new THREE.Mesh(new THREE.LatheGeometry(prof.map(p => new THREE.Vector2(p[0], p[1])), 96), M.cone); cone.renderOrder = 4; scene.add(cone); }
// ---------- blade: plate on the tangent plane, edge on the +x generator, covering the back half (z < 0) ----------
const BL = new THREE.Group(); scene.add(BL);
{ const n = V(Math.cos(G.TH), -Math.sin(G.TH), 0), g = V(Math.sin(G.TH), Math.cos(G.TH), 0); // outward normal, generator direction (up)
  const p0 = V(rc(G.BODY_Y0), G.BODY_Y0, 0); const L = (G.BODY_Y1 - G.BODY_Y0) / Math.cos(G.TH) + 2;
  const shape = S.shapeOf([[0, 0.15], [L, 0.15], [L, -8.5], [0, -8.5]].map(([a, b]) => [a, b]));
  const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.8, bevelEnabled: false });
  // local (a along g, b along z, c along n)
  const m = new THREE.Matrix4().makeBasis(g, V(0, 0, 1), n); m.setPosition(p0.clone().addScaledVector(g, -1)); geo.applyMatrix4(m);
  const blade = new THREE.Mesh(geo, M.blade); BL.add(blade);
  { const eg = new THREE.BoxGeometry(L, 0.35, 0.9); const e = new THREE.Mesh(eg, phys({ color: 0xffffff, metalness: 1, roughness: 0.08, envMapIntensity: 2.6 }));
    const em = new THREE.Matrix4().makeBasis(g, V(0, 0, 1), n); em.setPosition(p0.clone().addScaledVector(g, L / 2 - 1).add(V(0, 0, -0.05)).addScaledVector(n, 0.45)); e.applyMatrix4(em); BL.add(e); }
  const sc = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.2, 1.2, 32), M.blade); const sp = p0.clone().addScaledVector(g, 14).add(V(0, 0, -4.5)).addScaledVector(n, 1.2);
  sc.position.copy(sp); sc.quaternion.setFromUnitVectors(V(0, 1, 0), n); BL.add(sc);
  const slot = new THREE.Mesh(new THREE.BoxGeometry(0.5, 2.6, 1.25), phys({ color: 0x222, roughness: 0.6 })); slot.position.copy(sp).addScaledVector(n, 0.3); slot.quaternion.copy(sc.quaternion); slot.rotateY(0.6); BL.add(slot);
  BL.userData = { n, g, p0 }; }
// ---------- pencil: rebuilt lathe profiles each frame (wood cone, lead core, painted barrel) ----------
const PEN = new THREE.Group(); scene.add(PEN);
const woodM = new THREE.Mesh(new THREE.BufferGeometry(), M.wood), leadM = new THREE.Mesh(new THREE.BufferGeometry(), M.lead), paintM = new THREE.Mesh(new THREE.BufferGeometry(), M.paint);
PEN.add(woodM, leadM, paintM);
const TOP = 140;
function lat(m, prof, seg = 72) { m.geometry.dispose(); m.geometry = new THREE.LatheGeometry(prof.map(p => new THREE.Vector2(Math.max(0.001, p[0]), p[1])), seg); }
function buildPencil(ye, cut) {
  const R = G.R_PEN, RL = G.R_LEAD; const r = (y) => cut ? Math.min(R, rc(y)) : R;
  const yT = cut ? Math.max(ye, G.Y_TOUCH) : ye;                          // where the cut cone meets the barrel
  // lead core: flat end at ye (radius min(RL, r(ye))), cone section where rc < RL, then cylinder RL
  const lp = [[0, ye], [Math.min(RL, r(ye)), ye]]; if (cut && rc(ye) < RL) { const yl = Math.min(G.Y_LEAD, TOP); for (let i = 1; i <= 8; i++) { const y = ye + (yl - ye) * i / 8; lp.push([Math.min(RL, rc(y)), y]); } }
  lp.push([RL, TOP - 1], [0, TOP - 1]); lat(leadM, lp, 48);
  // wood: annular end at ye (from RL to r(ye)) when r(ye) > RL, then the cone up to yT, then barrel radius R - 0.1 under the paint
  const y1 = cut ? Math.max(ye, Math.min(G.Y_LEAD, yT)) : ye; const wp = [];
  if (r(y1) > RL + 0.01) { wp.push([RL, y1]); }
  wp.push([Math.max(RL, r(y1)), y1]); if (cut) for (let i = 1; i <= 16; i++) { const y = y1 + (yT - y1) * i / 16; wp.push([Math.max(RL, r(y)), y]); }
  wp.push([R - 0.05, yT + 0.001], [R - 0.05, TOP], [RL, TOP]); lat(woodM, wp, 72);
  // paint: barrel from yT (scalloped edge approximated by a thin bevel) up
  lat(paintM, [[R - 0.05, yT + 0.05], [R, yT + 0.25], [R, TOP], [R - 0.05, TOP + 0.1]], 72);
}
// ---------- shaving: fan-shaped frill growing at the blade's outer face ----------
const SHV = new THREE.Mesh(new THREE.BufferGeometry(), M.shave); scene.add(SHV); SHV.castShadow = true;
function buildShaving(f, ye) {
  if (f <= 0.002) { SHV.visible = false; return; } SHV.visible = true;
  const { n, g, p0 } = BL.userData; const NU = 90, NV = 8; const pos = [], col = [], idx = [];
  const w = Math.max(1.2, (G.Y_TOUCH - Math.max(ye, G.BODY_Y0)) / Math.cos(G.TH)) * 0.9;      // width = slant length being cut
  const span = 0.6 + 4.6 * f;                                                                      // angular length of the fan
  const sm = ((Math.max(ye, G.BODY_Y0) + G.Y_TOUCH) / 2 - G.BODY_Y0) / Math.cos(G.TH); const C = p0.clone().addScaledVector(g, sm).addScaledVector(n, 3.2).add(V(0, 0, -2.6));
  const zA = V(0, 0, -1), up = g.clone();
  for (let i = 0; i <= NU; i++) { const u = i / NU, a = -0.3 + span * u;
    for (let j = 0; j <= NV; j++) { const v = j / NV; const rr = 2.2 + v * w * 0.5; const ruf = Math.sin(a * 9 + v * 3) * 0.7 * v;
      const p = C.clone().addScaledVector(zA, rr * Math.cos(a)).addScaledVector(up, rr * Math.sin(a)).addScaledVector(n, 1.2 * v + ruf + 0.4 * u);
      pos.push(p.x, p.y, p.z); const paint = v > 0.9; const lead = v < 0.08 && ye < G.Y_LEAD + 1;
      if (paint) col.push(0.95, 0.68, 0.1); else if (lead) col.push(0.18, 0.18, 0.2); else { const k = 0.85 + 0.15 * Math.sin(u * 40 + v * 7); col.push(0.85 * k, 0.62 * k, 0.4 * k); } } }
  for (let i = 0; i < NU; i++) for (let j = 0; j < NV; j++) { const a = i * (NV + 1) + j, b = a + NV + 1; idx.push(a, b, a + 1, b, b + 1, a + 1); }
  SHV.geometry.dispose(); const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); geo.setIndex(idx); geo.computeVertexNormals(); SHV.geometry = geo;
}
S.shadowAll(scene);

// ---------- kinematics ----------
const DT = 1 / G.FPS_K;
function kin(t) { t = Math.max(0, Math.min(LOOP - 1e-6, t)); const i = Math.min(KN.length - 2, Math.floor(t / DT)), u = (t - KN[i][0]) / DT; const a = KN[i], b = KN[i + 1]; return a.map((v, j) => v + (b[j] - v) * u); }
const fade = (t, a, b, f = 0.25) => Math.min(S.smooth((t - a) / f), 1 - S.smooth((t - b + f) / f));
let KK = null;
function setScene(t) {
  const k = KK = kin(t); const ye = k[1], ang = k[2], lift = k[3], f = k[4];
  const cut = t < T.hookEnd || f > 0;
  buildPencil(ye, cut); PEN.position.y = lift; PEN.rotation.y = ang;
  buildShaving(t < T.hookEnd ? 1 : f, t < T.hookEnd ? G.YE_FINAL : ye);
  K.glow(BL, Math.min(1, fade(t, T.vo1 + 1.2, T.vo2 - 0.1, 0.35)) * 0.7);
  M.cone.opacity = 0.22 + 0.35 * Math.min(1, fade(t, T.vo1 + 0.3, T.vo2 - 0.1, 0.35), 1) + 0.25 * fade(t, T.vo3, T.vo4 + 1.5, 0.4);
  M.cone.color.setHex(0x6fb6ff).lerp(new THREE.Color(0xffb21f), Math.max(fade(t, T.vo1 + 0.3, T.vo2 - 0.1, 0.35), fade(t, T.vo3, T.vo4 + 1.5, 0.4)) * 0.8);
  K.shoot(st, CAMK, t);
}
// ---------- camera keys [t, tx, ty, tz, dist, elev, azim] ----------
const k_ = (t, a) => [t, ...a];
const CAMK = [k_(0, [3, 12, 0, 105, 8, 30]), k_(T.hookEnd - 0.01, [3, 13, 0, 102, 8, 32]),
  k_(T.hookEnd, [3, 4, 0, 125, 10, 34]), k_(T.vo1 - 0.2, [3, 3, 0, 120, 10, 34]),
  k_(T.vo1 + 1.0, [3, -1, 0, 100, 8, 30]), k_(T.vo2 - 0.2, [3, -1, 0, 97, 8, 30]),
  k_(T.vo2 + 0.5, [3, -1, -1, 92, 12, 48]), k_(T.vo3 - 0.2, [3, -1, -1, 90, 12, 50]),
  k_(T.vo3 + 0.5, [2, -1, 0, 100, 6, 22]), k_(T.vo4 - 0.1, [2, -1, 0, 97, 6, 24]),
  k_(T.vo4 + 0.6, [3, -2, 0, 100, 8, 30]), k_(T.cut_b, [3, -2, 0, 98, 8, 32]),
  k_(T.vo5 + 0.5, [3, 0, 0, 112, 9, 32]), k_(LOOP, [3, 1, 0, 108, 8, 30])];
// ---------- overlay ----------
const scr = (x, y, z = 0) => S.toScreen(camera, V(x, y, z));
function arcArrow(g2, a, cx, cy, R, a0, a1, ccwDir, color = '#ff7a1a', w = 13, sy = 0.35) { if (a <= 0) return; g2.save(); g2.globalAlpha = a; g2.translate(cx, cy); g2.scale(1, sy); g2.strokeStyle = color; g2.lineWidth = w; g2.lineCap = 'round';
  g2.beginPath(); g2.arc(0, 0, R, a0, a1, ccwDir); g2.stroke(); const ex = R * Math.cos(a1), ey = R * Math.sin(a1), tg = a1 + (ccwDir ? -1 : 1) * Math.PI / 2;
  g2.fillStyle = color; g2.beginPath(); g2.moveTo(ex + 30 * Math.cos(tg), ey + 30 * Math.sin(tg) / sy * 0.4); g2.lineTo(ex + 22 * Math.cos(tg + 2.3), ey + 22 * Math.sin(tg + 2.3)); g2.lineTo(ex + 22 * Math.cos(tg - 2.3), ey + 22 * Math.sin(tg - 2.3)); g2.closePath(); g2.fill(); g2.restore(); }
function overlay(t) {
  const g2 = st.g2; S.vignette(g2, 0); const k = KK || kin(t); const ye = k[1];
  { const fx = Math.max(0, 1 - Math.abs(t - T.hookEnd) / 0.12); K.TXT.flash(g2, 0.75 * fx); }
  const hk = t < 4 ? 1 - S.smooth((t - (T.vo1 - 0.3)) / 0.3) : 0;
  if (hk > 0) { K.TXT.hook(g2, hk, 'HOW DOES IT MAKE', 'A PERFECT POINT?', 92); const [cx0, cy0] = scr(0, G.YE_FINAL + k[3] + 1, 0); K.TXT.circle(g2, hk, cx0, cy0, 80, [-230, 250]); }
  const s1 = fade(t, T.vo1 - 0.1, T.vo2 - 0.05), s2 = fade(t, T.vo2, T.vo3 - 0.05), s3 = fade(t, T.vo3, T.vo4 - 0.05), s4 = fade(t, T.vo4, T.vo5 - 0.05);
  const pl = Math.max(s1, s2, s3, s4); if (pl > 0) { g2.save(); g2.globalAlpha = pl * 0.62; g2.fillStyle = '#05070a'; S.rrect(g2, 66, 352, 858, 116, 26); g2.fill(); g2.restore(); }
  K.TXT.step(g2, s1, 1, 'A CONE-SHAPED HOLE + A BLADE', 56);
  K.TXT.step(g2, s2, 2, 'TWIST: THE BLADE SHAVES WOOD', 56);
  K.TXT.step(g2, s3, 3, 'IT ONLY GOES DEEPER ONCE IT FITS', 54);
  K.TXT.step(g2, s4, 4, 'THE WOOD BECOMES THE CONE', 56);
  { const a = fade(t, T.vo1 + 0.5, T.vo2 - 0.05, 0.25); if (a > 0) { S.tag(g2, a, 'CONE', ...scr(-rc(-6) - 0.2, -6, 0), -160, 120, 54, '#ffd21f');
      S.tag(g2, fade(t, T.vo1 + 1.3, T.vo2 - 0.05, 0.25), 'BLADE', ...scr(rc(2) + 1, 2, -3), -40, 250, 54, '#ffffff'); } }
  { const a = fade(t, T.cut_a, T.vo3 - 0.05, 0.25); if (a > 0) { const [px, py] = scr(0, 10.5, 0), [qx] = scr(G.R_PEN, 10.5, 0); arcArrow(g2, a, px, py, Math.abs(qx - px) * 2.4, 2.6, 0.5, true, '#ffd21f', 12);
      S.tag(g2, fade(t, T.cut_a + 0.8, T.vo3 - 0.05, 0.25), 'SHAVING', ...scr(rc(-2) + 4, -2, -3), -60, 260, 52, '#ffffff'); } }
  { const a = fade(t, T.vo3 + 0.3, T.vo4 - 0.05, 0.25); if (a > 0) { const [ax, ay] = scr(G.BODY_X0 - 1, 6, 0); S.forceArrow(g2, a, ax - 50, ay - 70, ax - 50, ay + 90, 16);
      const [ex, ey] = scr(0, ye, 0); S.tag(g2, fade(t, T.vo3 + 0.8, T.vo4 - 0.05, 0.25), 'STILL TOO WIDE', ex, ey, -200, 160, 50, '#ffffff'); } }
  { const a = fade(t, T.vo4 + 1.6, T.vo5 - 0.05, 0.25); if (a > 0 && ye < G.Y_LEAD) S.tag(g2, a, 'LEAD AT THE TIP', ...scr(0, ye + 0.4, 0), -210, 170, 52, '#ffd21f'); }
  K.TXT.answer(g2, fade(t, T.vo5 + 0.05, LOOP - 1.3, 0.3), 'THE HOLE IS A CONE', 'THE BLADE SHAVES TO FIT', 470);

S.install(st, setScene, overlay); window.ready = false;
await document.fonts.load('40px Anton');
