const KEYS = [
  [0.0, -14, 4, 330, 17, 104, 1], [2.45, -12, 4, 310, 20, 110, 1], [3.55, -12, 0, 250, 64, 176, 0.25], [4.0, -12, 0, 250, 68, 180, 0],
