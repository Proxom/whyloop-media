const rnd = (() => { let s = 1104; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
const AIRD = Array.from({ length: 26 }, () => [rnd(), rnd(), rnd(), rnd()]);
const HEATD = Array.from({ length: 14 }, () => [rnd(), rnd()]);
const heatX = (phase, u) => phase === 'air' ? 18 + u * 44 : 18 + 11.3 * (1 - Math.abs(1 - 2 * u));
const Y0 = 96, Y1 = 146;            // dot band (mm) in the macro shots
function dot(g2, x, y, r, fill, a = 1) { g2.save(); g2.globalAlpha = a; g2.fillStyle = fill; g2.beginPath(); g2.arc(x, y, r, 0, 7); g2.fill(); g2.strokeStyle = 'rgba(20,10,0,0.75)'; g2.lineWidth = 2.5; g2.stroke(); g2.restore(); }
