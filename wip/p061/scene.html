<script type="module">
// p061 bike quick release: why does it stay shut? mm. x = axle axis (outward, the dropout's outer face is x = 0), y up, z = bike front (viewer side).
// The lever and its eccentric cam turn about the pin (axis z) on the skewer rod's end; the cam pushes the cam body (follower) onto the dropout.
import * as S from '/tools/render/lib/studio.js';
const THREE = S.THREE;
const KJ = await (await fetch('kin_240.json')).json();

const st = S.makeStudio({ fov: 30, bg: 0x0d1117, envIntensity: 0.85, bloom: 0, near: 5, far: 4000, samples: 0 });

const { scene, camera } = st; const { shapeOf, extrude } = S;
await document.fonts.load('80px Anton');

const kin = (t) => { t = ((t % LOOP) + LOOP) % LOOP; const f = t * HZ, i = Math.min(K.length - 2, Math.floor(f)), u = f - i; const a = K[i], b = K[i + 1];
  const L = (k) => a[k] + (b[k] - a[k]) * u; return { g: L('g'), b: L('b'), pin: L('pin'), x0: L('x0'), F: L('F') }; };

const grain = S.noiseTex(9, 140, 16, 256); grain.wrapS = grain.wrapT = THREE.RepeatWrapping; grain.repeat.set(0.08, 0.08);

  g.fillStyle = '#909090'; g.fillRect(0, 0, 512, 64); for (let i = 0; i < 900; i++) { const v = 110 + r() * 60 | 0; g.fillStyle = `rgba(${v},${v},${v},0.35)`; g.fillRect(r() * 512, r() * 64, 40 + r() * 200, 1); }

  alu: new THREE.MeshPhysicalMaterial({ color: 0xd9dde2, roughness: 0.28, roughnessMap: brushed, metalness: 1.0, clearcoat: 0.3, clearcoatRoughness: 0.2 }),
  anod: new THREE.MeshPhysicalMaterial({ color: 0x2a2e35, roughness: 0.38, roughnessMap: grain, metalness: 0.85, clearcoat: 0.4, clearcoatRoughness: 0.25 }),
  steel: new THREE.MeshStandardMaterial({ color: 0xb8bec6, roughness: 0.3, metalness: 1.0 }),

  tire: new THREE.MeshStandardMaterial({ color: 0x17181a, roughness: 0.85, metalness: 0 }),

// backdrop
S.gradientFloor(scene, -420, 2400, 60, 60, ['#3a4250', '#1d222b', '#0a0c10']);
S.studioLights(scene, new THREE.Vector3(10, 10, 0), 80);
{ const fill = new THREE.PointLight(0xffe2c4, 2200, 0, 2); fill.position.set(60, 40, 120); scene.add(fill);
  const rimB = new THREE.DirectionalLight(0xb8d0ff, 1.4); rimB.position.set(160, 120, -200); scene.add(rimB); }

const rotX = (m) => { m.rotation.y = Math.PI / 2; return m; }; // extrude axis (local z) -> world x; shape coords (u, v) = (-z, y)
// ---------- fork: dropout plate + tapered blade ----------
{
  const P = [[-13, 44], [-13, -4], [-11, -11], [-6.5, -15], [-4.6, -15], [-4.6, 0], [-4.6, 0]];
  for (let i = 0; i <= 16; i++) { const a = Math.PI - i / 16 * Math.PI; P.push([4.6 * Math.cos(a), 4.6 * Math.sin(a)]); }
  P.push([4.6, -15], [6.5, -15], [11, -11], [13, -4], [13, 44]);
  const m = rotX(extrude(shapeOf(P), -5, 0, M.paint, 0.8, 24)); scene.add(m); S.shadowAll(m);
  const blade = new THREE.Mesh(new THREE.CylinderGeometry(1, 0.82, 1, 48, 1, false), M.paint); blade.scale.set(6.5, 330, 11); blade.position.set(-6.5, 36 + 165, 0); scene.add(blade); S.shadowAll(blade);
  const cap = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 16), M.paint); cap.scale.set(5.4, 9, 9.1); cap.position.set(-6.5, 38, 0); scene.add(cap); }
// ---------- hub: axle, locknut, shell, flange, spokes, tire ----------
{ const ax = new THREE.Mesh(new THREE.CylinderGeometry(4.5, 4.5, 70, 40), M.steel); ax.rotation.z = Math.PI / 2; ax.position.set(-35.5, 0, 0); scene.add(ax);
  const nut = new THREE.Mesh(new THREE.CylinderGeometry(9, 9, 8, 6), M.alu); nut.rotation.z = Math.PI / 2; nut.position.set(-9.05, 0, 0); scene.add(nut);
  const cone = new THREE.Mesh(new THREE.CylinderGeometry(8, 10.5, 6, 48), M.alu); cone.rotation.z = Math.PI / 2; cone.position.set(-16.1, 0, 0); scene.add(cone);
  const shell = new THREE.Mesh(new THREE.CylinderGeometry(11, 11, 60, 64), M.alu); shell.rotation.z = Math.PI / 2; shell.position.set(-49.1, 0, 0); scene.add(shell);
  const fl = new THREE.Mesh(new THREE.CylinderGeometry(24, 24, 3, 64), M.alu); fl.rotation.z = Math.PI / 2; fl.position.set(-30.5, 0, 0); scene.add(fl);
  for (let i = 0; i < 18; i++) { const a = i / 18 * Math.PI * 2 + 0.1; const p0 = new THREE.Vector3(-30.5, 21 * Math.cos(a), 21 * Math.sin(a)); const a2 = a + (i % 2 ? 0.55 : -0.55);
    const p1 = new THREE.Vector3(-57, 300 * Math.cos(a2), 300 * Math.sin(a2)); const d = p1.clone().sub(p0); const sp = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, d.length(), 8), M.spoke);
    sp.position.copy(p0.clone().add(p1).multiplyScalar(0.5)); sp.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize()); scene.add(sp); }
  const tire = new THREE.Mesh(new THREE.TorusGeometry(318, 15, 24, 160), M.tire); tire.rotation.y = Math.PI / 2; tire.position.x = -57; scene.add(tire);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(300, 6, 12, 160), M.alu); rim.rotation.y = Math.PI / 2; rim.position.x = -57; rim.scale.set(1, 1, 1.0); scene.add(rim);
  scene.traverse(o => { if (o.isMesh && o.material !== M.paint) { o.castShadow = true; o.receiveShadow = true; } }); }
// ---------- skewer rod (moves with the pin) ----------
const rodG = new THREE.Group(); scene.add(rodG);
{ const rod = new THREE.Mesh(new THREE.CylinderGeometry(2.5, 2.5, 80, 32), M.steel); rod.rotation.z = Math.PI / 2; rod.position.x = -9.6 - 40; rodG.add(rod);
  const tang = new THREE.Mesh(new THREE.BoxGeometry(12.2, 4.4, 2.4), M.steel); tang.position.x = -9.6 + 6.1; rodG.add(tang);
  const pin = new THREE.Mesh(new THREE.CylinderGeometry(2.0, 2.0, 6.4, 32), M.steel); pin.rotation.x = Math.PI / 2; rodG.add(pin); S.shadowAll(rodG); }
// ---------- cam body: follower (solid) + two shells around the cam slot (front shell fades) ----------
const body = new THREE.Group(); scene.add(body); const RB = 10.5, ZS = 3.2, LS = 17;
{ const fol = new THREE.Mesh(new THREE.CylinderGeometry(RB, RB, FOL, 72), M.anod); fol.rotation.z = Math.PI / 2; fol.position.x = FOL / 2; body.add(fol);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(RB - 0.4, 0.4, 8, 72), M.anod); ring.rotation.y = Math.PI / 2; ring.position.x = FOL - 0.05; body.add(ring);
  const seg = (side) => { const P = []; const a0 = Math.asin(ZS / RB); for (let i = 0; i <= 40; i++) { const a = a0 + (Math.PI - 2 * a0) * i / 40; P.push([-side * RB * Math.sin(a), RB * Math.cos(a)]); } // (u=-z, v=y)
    const m = rotX(extrude(shapeOf(side > 0 ? P.reverse() : P), FOL - 0.01, FOL + LS, M.anod, 0.6, 24)); return m; };
  const back = seg(-1); back.material = M.anod.clone(); back.material.color.set(0x3b414b); body.add(back); const front = seg(1); front.material = M.anod.clone(); front.material.transparent = true; body.add(front); body.userData.front = front;
  S.shadowAll(body); }
// ---------- lever + cam (one part, turns about the pin) ----------
const lever = new THREE.Group(); scene.add(lever); const camG = new THREE.Group(); lever.add(camG);
{ const ring = S.circle(0, 0, R, 96, false); const hole = S.circle(-E, 0, 2.05, 32, true); // cam disc in lever frame: centre at (E,0) rotated... built at local origin = pin
  // local frame: x axis = cam offset direction (beta). cam centre at (E, 0).
  const disc = S.circle(E, 0, R, 96, false); const ph = S.circle(0, 0, 2.05, 32, true);
  for (const [z0, z1] of [[1.4, 3.0], [-3.0, -1.4]]) { const m = extrude(shapeOf(disc, [ph]), z0, z1, M.cam, 0.25, 96); camG.add(m); }
  { const w = []; for (let i = 0; i <= 12; i++) { const a = -0.32 + 0.64 * i / 12; w.push([E + (R - 0.5) * Math.cos(a), (R - 0.5) * Math.sin(a)]); } w.push([E + 3.2, 0.9], [E + 3.2, -0.9]);
    const mk = extrude(shapeOf(w), 3.0, 3.25, new THREE.MeshStandardMaterial({ color: 0xffe14a, roughness: 0.4, metalness: 0.1, emissive: 0x6a5200 }), 0, 24); camG.add(mk); }
  // lever arm in the cam frame: lever direction alpha = beta - 98 deg
  const la = -98 * Math.PI / 180; const dir = [Math.cos(la), Math.sin(la)], nrm = [-dir[1], dir[0]];
  const prof = [[5.5, -4.6], [20, -4.2], [46, -5.6], [60, -6.6], [64, -5.0], [65, 0], [64, 5.0], [60, 6.6], [46, 5.6], [20, 4.2], [5.5, 4.6]];
  const P = prof.map(([s, w]) => [dir[0] * s + nrm[0] * w, dir[1] * s + nrm[1] * w]);
  const arm = extrude(shapeOf(P), -2.6, 2.6, M.alu, 0.9, 32); camG.add(arm);
  const web = extrude(shapeOf(S.circle(dir[0] * 6, dir[1] * 6, 4.4, 40)), -2.6, 2.6, M.alu, 0.5, 32); camG.add(web);
  S.shadowAll(lever); }

// ---------- camera keys: [t, tx, ty, tz, dist, elev, azim] ----------
const HOOK = [0, 20, 6, 0, 230, 14, 38];
const KEYS = [HOOK, [1.7, 20, 6, 0, 230, 14, 38], [3.0, 30, 6, 0, 205, 4, 6], [4.4, 12, 2, 0, 118, 2, 3], [8.4, 11, 2, 0, 104, 2, 2], [9.9, 11, 4, 0, 112, 2, 2],
  [10.6, 12, 18, 0, 170, 3, 4], [12.4, 12, 18, 0, 175, 3, 5], [13.6, 28, 8, 0, 205, 4, 6], [15.0, 20, 6, 0, 230, 14, 38], [17.0, 20, 6, 0, 230, 14, 38]];
const front = body.userData.front;
const fadeA = (t) => t < 1.7 ? 1 : t < 2.7 ? 1 - S.smooth((t - 1.7) / 1.0) : t < 14.4 ? 0 : t < 15.4 ? S.smooth((t - 14.4) / 1.0) : 1;
let cur = null;
function setScene(t) {
  const k = kin(t); cur = k;
  rodG.position.x = k.pin; body.position.x = k.x0; lever.position.set(k.pin, 0, 0); lever.rotation.z = k.b * Math.PI / 180;
  const a = fadeA(t); front.material.opacity = 0.04 + 0.96 * a; front.material.depthWrite = a > 0.98; front.visible = a > 0.01; front.castShadow = a > 0.5;
  const sq = (t > 4.6 && t < 12.9) ? Math.min(1, k.F * 1.1) : 0; M.cam.emissiveIntensity = 0.55 * sq * (t > 9.3 && t < 10.4 ? 1.4 : 1);
  const c = S.orbitCam(KEYS, t); camera.position.copy(c.pos); camera.lookAt(c.target); camera.updateMatrixWorld();
}
const scr = (x, y, z = 0) => S.toScreen(camera, new THREE.Vector3(x, y, z));
const win = (t, a, b, f = 0.25) => t < a - f || t > b + f ? 0 : t < a ? (t - (a - f)) / f : t > b ? 1 - (t - b) / f : 1;
function overlay(t) {
  const g = st.g2; S.vignette(g, 520); const k = cur;
  const la = (90 - k.g) * Math.PI / 180; const dir = [Math.cos(la), Math.sin(la)], tan = [-dir[1], dir[0]];
  const tip = [k.pin + dir[0] * 25, dir[1] * 25];
  // hook
  if (t < 1.9) { const a = t < 1.5 ? 1 : 1 - (t - 1.5) / 0.4; const [cx, cy] = scr(k.x0 + 12, 0, 6); S.redCircle(g, a, cx, cy, 78, [-250, 200]); S.hookCard(g, a, 'WHY DOES IT', 'STAY SHUT?', 124); }
  if (t > 16.55) { const a = (t - 16.55) / 0.45; const [cx, cy] = scr(k.x0 + 12, 0, 6); S.redCircle(g, a, cx, cy, 78, [-250, 200]); S.hookCard(g, a, 'WHY DOES IT', 'STAY SHUT?', 124); }
  // causes: push to close, tug, pull open (arrow at the lever tip, along the swing direction)
  const arrow = (a, sgn) => { if (a <= 0) return; const p0 = scr(tip[0] - sgn * tan[0] * 22, tip[1] - sgn * tan[1] * 22, 4), p1 = scr(tip[0] - sgn * tan[0] * 4, tip[1] - sgn * tan[1] * 4, 4); S.forceArrow(g, a, p0[0], p0[1], p1[0], p1[1], 24); };
  arrow(win(t, 2.75, 9.35, 0.2), 1); arrow(win(t, 10.75, 11.25, 0.12), -1); arrow(win(t, 12.55, 13.6, 0.15), -1);
  // labels and captions (one at a time)
  { const a = win(t, 2.4, 4.7); if (a > 0) { const [px, py] = scr(k.pin + E * Math.cos(k.b * Math.PI / 180) + 2, 3, 3); S.tag(g, a, 'OFF-CENTER CAM', px, py, 60, -230, 56, '#ffb020'); } }
  S.caption(g, win(t, 5.0, 8.3), 'IT SQUEEZES THE FORK', 450, 74, '#ffffff');
  S.caption(g, win(t, 8.45, 10.9), 'PAST THE PEAK...', 450, 84, '#ffd21f');
  S.caption(g, win(t, 11.05, 13.6), 'SQUEEZE HOLDS IT SHUT', 450, 80, '#ffffff');
  // squeeze arrows on both sides of the dropout (size follows the clamp force)
  const sq = (t > 4.75 && t < 13.0) ? k.F : 0; if (sq > 0.02) { const L = 3 + 5 * sq, y = 12.5; const a1 = scr(1 + L + 3, y), b1 = scr(1, y), a2 = scr(-6 - L - 5, y), b2 = scr(-6, y);
    S.forceArrow(g, Math.min(1, sq * 3), a1[0], a1[1], b1[0], b1[1], 20); S.forceArrow(g, Math.min(1, sq * 3), a2[0], a2[1], b2[0], b2[1], 20); }
  // follow line
  if (t > 15.3 && t < 16.8) { const a = Math.min(1, (t - 15.3) / 0.25, (16.8 - t) / 0.25); g.save(); g.globalAlpha = a; S.outlined(g, 'FOLLOW → NEW MACHINE TOMORROW', S.CX, 1380, 54, '#ffffff'); g.restore(); }
}
window.motionPx = () => 0;
window.probe = (t) => { setScene(t); return { k: cur, cam: [scr(cur.pin, 0), scr(0, 0)] }; };
S.install(st, setScene, overlay);
