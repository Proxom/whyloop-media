// ---------- kinematics ----------
const DT = 1 / G.FPS_K;
function kin(t) { t = Math.max(0, Math.min(LOOP - 1e-6, t)); const i = Math.min(KN.length - 2, Math.floor(t / DT)), u = (t - KN[i][0]) / DT; const a = KN[i], b = KN[i + 1];
  if (Math.abs(b[1] - a[1]) > 20) return a; return a.map((v, j) => j >= 5 ? a[j] : v + (b[j] - v) * u); }

  const lb = Math.atan2(Math.sin(beta), Math.cos(beta)); ARM.rotation.y = -lb;      // arm direction in door-local coords

const OUTK = (az = 18, d = 1500, ty = 1840, tx = 380) => [tx - 90, 2010, 180, d * 1.5, 30, az + 4];
const INK = (dx = 0, d = 520, az = 0, el = 8) => [6000 + dx, -14, 0, d * 1.6, el, az];

const OP = [[-60, -8], [-72, -20], [-72, -45], [-6, -45], [6, -45], [72, -45], [72, -20], [60, -8]];
function oilAt(s) { const L = []; let tot = 0; for (let i = 1; i < OP.length; i++) { const l = Math.hypot(OP[i][0] - OP[i - 1][0], OP[i][1] - OP[i - 1][1]); L.push(l); tot += l; }
