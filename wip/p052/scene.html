<script type="module">
// p052 seatbelt retractor: why does a seatbelt lock when you yank it? y-up world, spool axis = +z (locking side faces the camera).
import * as S from '/tools/render/lib/studio.js';
const THREE = S.THREE;
const KIN = window.KIN;
const geo = await (await fetch('geom.json')).json(); KIN.init(geo);
const kinT = await (await fetch('kin_240.json')).json();
const LOOP = KIN.P.LOOP; const DW = S.DW, DH = S.DH;

const st = S.makeStudio({ fov: 32, bg: 0x0b0e14, envIntensity: 0.6, bloom: 0, near: 2, far: 6000, samples: 0 });
st.renderer.toneMappingExposure = 1.1;
const { scene, camera } = st;

// ---------- materials ----------
const brush = (() => { const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d'); const r = S.rng(5); g.fillStyle = '#7a7a7a'; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 1600; i++) { const v = 122 + (r() - 0.5) * 26; g.strokeStyle = `rgba(${v | 0},${v | 0},${v | 0},0.5)`; g.lineWidth = 0.5 + r(); const y = r() * 512; g.beginPath(); g.moveTo(0, y); g.lineTo(512, y + (r() - 0.5) * 3); g.stroke(); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(0.04, 0.04); return t; })();
// woven webbing texture: fine twill + a stitched band every 60 mm so the belt's motion reads (tileable)
function webTex(rep) { const c = document.createElement('canvas'); c.width = 256; c.height = 512; const g = c.getContext('2d'); g.fillStyle = '#3a3e45'; g.fillRect(0, 0, 256, 512);
  for (let y = -256; y < 768; y += 6) { g.strokeStyle = 'rgba(20,22,26,0.55)'; g.lineWidth = 2; g.beginPath(); g.moveTo(0, y); g.lineTo(256, y + 128); g.stroke(); }
  for (let x = 0; x < 256; x += 8) { g.strokeStyle = 'rgba(90,96,106,0.35)'; g.lineWidth = 1; g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 512); g.stroke(); }
  g.fillStyle = '#c9a227'; for (const y of [236, 268]) g.fillRect(0, y, 256, 8);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1, rep); t.anisotropy = 4; return t; }
const M = {
  plate: new THREE.MeshPhysicalMaterial({ color: 0xd2ad55, metalness: 1, roughness: 0.3, roughnessMap: brush }),
  teeth: new THREE.MeshPhysicalMaterial({ color: 0xffe2a0, metalness: 1, roughness: 0.14, clearcoat: 0.5, emissive: 0x3a2c10 }),
  frame: new THREE.MeshPhysicalMaterial({ color: 0x8e949c, metalness: 1, roughness: 0.4, roughnessMap: brush }),
  frameSide: new THREE.MeshPhysicalMaterial({ color: 0xc8cdd3, metalness: 1, roughness: 0.22 }),
  driver: new THREE.MeshPhysicalMaterial({ color: 0x2c3036, metalness: 0.9, roughness: 0.4, clearcoat: 0.5, clearcoatRoughness: 0.12 }),
  driverSide: new THREE.MeshPhysicalMaterial({ color: 0x6d737c, metalness: 1, roughness: 0.22 }),
  pawl: new THREE.MeshPhysicalMaterial({ color: 0xff5a0a, metalness: 0.7, roughness: 0.24, clearcoat: 1.0, clearcoatRoughness: 0.06 }),
  spring: new THREE.MeshPhysicalMaterial({ color: 0xd6dade, metalness: 1, roughness: 0.3 }),
  chrome: new THREE.MeshPhysicalMaterial({ color: 0xe6e9ec, metalness: 1, roughness: 0.12, clearcoat: 0.4 }),
  roll: new THREE.MeshStandardMaterial({ map: webTex(1), roughness: 0.85, metalness: 0 }),
  strap: new THREE.MeshStandardMaterial({ map: webTex(1), roughness: 0.85, metalness: 0, side: THREE.DoubleSide }),
  mark: new THREE.MeshStandardMaterial({ color: 0xffd21f, roughness: 0.5 }),
  disc: new THREE.MeshPhysicalMaterial({ color: 0x9aa1aa, metalness: 1, roughness: 0.3, roughnessMap: brush, clearcoat: 0.3 }),
  gap: new THREE.MeshStandardMaterial({ color: 0x15171b, roughness: 0.7, metalness: 0.2 }),
};
const { shapeOf, circle, extrude, shadowAll, roundRect } = S;
const RW = 24.0, ZW0 = -54, ZW1 = -10, STRAP_L = 520; // webbing roll radius, width (z), free strap length

// ---------- fixed frame: front lock plate with 24 inward-facing teeth, back plate, base ----------
const frameG = new THREE.Group(); scene.add(frameG);
{ const pts = []; const N = geo.N, p = Math.PI * 2 / N;
  for (let k = N - 1; k >= 0; k--) { for (let i = 16; i >= 0; i--) { const s = i / 16; const a = (k + s) * p; const r = KIN.rprof(a + (s === 1 ? -1e-6 : 1e-6)); pts.push([r * Math.cos(a), r * Math.sin(a)]); } }
  const outer = roundRect(-31, -40, 31, 31, 5).reverse();
  const holes = [pts, circle(-22, -32, 2.6, 32), circle(22, -32, 2.6, 32)];
  frameG.add(extrude(shapeOf(outer, holes), -6.5, 0, [M.plate, M.teeth], 0.3, 16));
  const back = extrude(shapeOf(roundRect(-31, -40, 31, 31, 5).reverse(), [circle(0, 0, 8, 48)]), -64, -60, [M.frame, M.frameSide], 0.3, 16); frameG.add(back);
  const base = new THREE.Mesh(new THREE.BoxGeometry(62, 3.2, 57.2), M.frame); base.position.set(0, -41.6, -32.0); frameG.add(base);
  for (const x of [-22, 22]) { const b = new THREE.Mesh(new THREE.CylinderGeometry(4.2, 4.2, 2.4, 6), M.chrome); b.rotation.x = Math.PI / 2; b.position.set(x, -32, 1.25); frameG.add(b); }
}
// ---------- spool: locking disc + levers (front), webbing roll (between the plates) ----------
const spoolG = new THREE.Group(); scene.add(spoolG);
{ spoolG.add(extrude(shapeOf(geo.body, geo.bodyHoles), -6.2, 0.25, [M.disc, M.driverSide], 0.15, 16));
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(5.1, 5.1, 2.4, 48).rotateX(Math.PI / 2), M.chrome); hub.position.z = 0.6; spoolG.add(hub);
  const mark = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.1, 0.3, 24).rotateX(Math.PI / 2), M.mark); mark.position.set(8.2, 0, 0.32); spoolG.add(mark);
  const roll = new THREE.Mesh(new THREE.CylinderGeometry(RW, RW, ZW1 - ZW0, 128, 1, false).rotateX(Math.PI / 2), M.roll); roll.position.z = (ZW0 + ZW1) / 2; spoolG.add(roll);
  M.roll.map.repeat.set(1, 2); M.roll.map.rotation = Math.PI / 2;
  const fl = new THREE.Mesh(new THREE.CylinderGeometry(RW + 2.2, RW + 2.2, 1.2, 96).rotateX(Math.PI / 2), M.gap); fl.position.z = ZW1 + 0.7; spoolG.add(fl);
  const fl2 = fl.clone(); fl2.position.z = ZW0 - 0.7; spoolG.add(fl2);
  const axle = new THREE.Mesh(new THREE.CylinderGeometry(4.0, 4.0, 66, 48).rotateX(Math.PI / 2), M.chrome); axle.position.z = -32; spoolG.add(axle);
}
const pawlG = [0, 1].map(side => { const outer = new THREE.Group(); outer.rotation.z = side * Math.PI; spoolG.add(outer);
  const piv = new THREE.Group(); piv.position.set(geo.pivot[0], geo.pivot[1], 0); outer.add(piv);
  const loc = geo.pawl.map(p => [p[0] - geo.pivot[0], p[1] - geo.pivot[1]]);
  piv.add(extrude(shapeOf(loc, [circle(0, 0, 0.7, 24)]), -5.6, -0.25, [M.pawl, M.pawl], 0.15, 12));
  const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.68, 0.68, 6.4, 24).rotateX(Math.PI / 2), M.chrome); pin.position.set(geo.pivot[0], geo.pivot[1], -3.0); outer.add(pin);
  return { outer, piv, spring: null }; });
// light spring in the bore under each lever: it holds the lever in (anchored on the disc, hooked to the lever)
function buildSpring(P, db) {
  const aS = geo.springAng; const a = [10.6 * Math.cos(aS), 10.6 * Math.sin(aS)];
  const bot = KIN.rotP([12.45 * Math.cos(aS), 12.45 * Math.sin(aS)], db, 0); const L = Math.hypot(bot[0] - a[0], bot[1] - a[1]) - 0.05;
  const ax = new THREE.Vector3(bot[0] - a[0], bot[1] - a[1], 0).normalize(); const n1 = new THREE.Vector3(0, 0, 1); const n2 = new THREE.Vector3().crossVectors(ax, n1);
  const R = 0.7, wire = 0.18, turns = 5.5, N = 160, pts = [];
  for (let i = 0; i <= N; i++) { const u = i / N; const g = u * turns * Math.PI * 2; pts.push(new THREE.Vector3(a[0], a[1], -2.9).addScaledVector(ax, u * L).addScaledVector(n1, Math.cos(g) * R).addScaledVector(n2, Math.sin(g) * R)); }
  const g = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 320, wire, 8, false);
  if (P.spring) { P.spring.geometry.dispose(); P.spring.geometry = g; } else { P.spring = new THREE.Mesh(g, M.spring); P.spring.castShadow = true; P.outer.add(P.spring); }
}
// free strap: leaves the roll tangentially on the left (x = -RW) and runs straight up
const strap = new THREE.Mesh(new THREE.PlaneGeometry(ZW1 - ZW0 - 2, STRAP_L), M.strap); strap.rotation.y = Math.PI / 2; strap.position.set(-RW - 0.05, STRAP_L / 2, (ZW0 + ZW1) / 2); scene.add(strap);
M.strap.map.repeat.set(1, STRAP_L / 60);
{ const c = document.createElement('canvas'); c.width = c.height = 1024; const g = c.getContext('2d'); const gr = g.createRadialGradient(512, 430, 40, 512, 512, 700);
  gr.addColorStop(0, '#3a4250'); gr.addColorStop(0.45, '#1a1f28'); gr.addColorStop(1, '#07090d'); g.fillStyle = gr; g.fillRect(0, 0, 1024, 1024);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; const bd = new THREE.Mesh(new THREE.PlaneGeometry(4200, 4200), new THREE.MeshBasicMaterial({ map: t })); bd.position.z = -900; scene.add(bd); }
shadowAll(scene); strap.castShadow = true;
// ---------- lights ----------
const key = new THREE.DirectionalLight(0xfff0dc, 2.4); key.position.set(-140, 260, 300); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); { const c = key.shadow.camera; c.left = -90; c.right = 90; c.top = 120; c.bottom = -90; c.near = 150; c.far = 900; } key.shadow.bias = -0.0003; key.shadow.normalBias = 0.03; key.shadow.radius = 3;
scene.add(key, key.target);
const rim = new THREE.DirectionalLight(0xcfe0ff, 1.4); rim.position.set(260, 120, -160); scene.add(rim);
scene.add(new THREE.HemisphereLight(0xdde6ff, 0x2a2420, 0.28));
const soft = new THREE.DirectionalLight(0xfff0e0, 0.9); soft.position.set(-220, 60, 160); scene.add(soft);
const top = new THREE.DirectionalLight(0xe8f0ff, 0.7); top.position.set(60, 240, 120); scene.add(top);

// ---------- animation ----------
function kinAt(t) { t = ((t % LOOP) + LOOP) % LOOP; const f = t * 240; const i = Math.floor(f), u = f - i; const A = kinT[i % kinT.length], B = kinT[(i + 1) % kinT.length];
  return { ad: A.ad + (B.ad - A.ad) * u, db: A.db + (B.db - A.db) * u, lock: A.lock }; }
// camera: [t, tx, ty, tz, dist, elev, azim]
const KEYS = [
  [0.0, 2, 4, -20, 245, 18, -44],
  [2.2, 2, 4, -20, 232, 19, -42],
  [3.5, -1, -7, -3, 138, 13, -8],
  [7.2, -1, -7, -3, 130, 14, -5],
  [8.6, 2, 4, -20, 236, 19, -40],
  [11.4, 2, 4, -20, 252, 18, -45],
  [13.0, 2, 4, -20, 245, 18, -44],
];
function setScene(t) { const k = kinAt(t);
  spoolG.rotation.z = -k.ad;
  for (let s = 0; s < 2; s++) { pawlG[s].piv.rotation.z = k.db; buildSpring(pawlG[s], k.db); }
  M.strap.map.offset.y = -(k.ad * RW) / 60; // belt moves up as the spool unwinds (clockwise)
  const c = S.orbitCam(KEYS, t, LOOP); camera.position.copy(c.pos); camera.lookAt(c.target); camera.updateMatrixWorld(); return k; }
const scr = (x, y, z, rot = 0) => { const v = new THREE.Vector3(x, y, z).applyAxisAngle(new THREE.Vector3(0, 0, 1), rot); return S.toScreen(camera, v); };
const pawlTip = (k, side = 0) => { const a = geo.tipAng; const q = KIN.rotP([14.0 * Math.cos(a), 14.0 * Math.sin(a)], k.db, side); return scr(q[0], q[1], -1.0, -k.ad); };
// the top lever at any moment = the one whose tip is higher on screen
const topTip = (k) => { const a = pawlTip(k, 0), b = pawlTip(k, 1); return a[1] < b[1] ? a : b; };

// ---------- overlay ----------
await document.fonts.load('120px Anton');
const g2 = st.g2;
const win = (t, a, b, f = 0.18) => Math.max(0, Math.min(1, (t - a) / f, (b - t) / f));
function upArrow(a, x, y0, y1) { S.forceArrow(g2, a, x, y0, x, y1, 22); }
function overlay(t, k) {
  S.vignette(g2, 560);
  const hookA = Math.max(0, Math.min(1, (2.3 - t) / 0.18), Math.min(1, (t - 12.82) / 0.18));
  if (hookA > 0) { S.hookCard(g2, hookA, 'WHY DOES IT', 'LOCK?', 112); const [x, y] = topTip(k); S.redCircle(g2, hookA, x, y, 56, [-230, 170]); }
  let a; const sx = scr(-RW, 60, (ZW0 + ZW1) / 2)[0];
  if ((a = win(t, 0.5, 3.55)) > 0 && t > 2.3) { S.label(g2, a, 'SLOW PULL: FREE', null, null, 1390, 88); }
  if ((a = win(t, 3.75, 4.35, 0.08)) > 0) S.label(g2, a, 'YANK!', null, null, 1390, 110);
  if ((a = win(t, 4.4, 5.9)) > 0) { S.label(g2, a, 'LOCKED', null, null, 1390, 96); const p = pawlTip(k, 1); S.redCircle(g2, a, p[0], p[1], 50, [-170, 150]); }
  if ((a = win(t, 6.0, 7.45)) > 0) S.label(g2, a, 'FAST SPIN = SWINGS OUT', null, null, 1390, 76);
  if ((a = win(t, 8.4, 10.9)) > 0) S.label(g2, a, 'SPRING WINDS IT BACK', null, null, 1390, 76);
  if ((a = win(t, 11.25, 12.72)) > 0) { g2.save(); g2.globalAlpha = a; S.outlined(g2, 'FOLLOW → PART 2 TOMORROW', S.CX, 1400, 56, '#ffffff'); g2.restore(); }
  // belt direction arrow beside the strap (only while it moves)
  const wv = (kinT[Math.min(kinT.length - 1, Math.round((((t % LOOP) + LOOP) % LOOP) * 240))].w || 0);
  if (Math.abs(wv) > 0.05 && t > 2.3 && t < 12.8 && (t < 3.2 || t > 8.3)) { const xa = Math.min(870, Math.max(110, sx - 70)); const aa = Math.min(1, Math.abs(wv) / 0.4) * 0.9; if (wv > 0) upArrow(aa, xa, 1120, 900); else upArrow(aa, xa, 900, 1120); }
}
window._st = st; window._set = setScene; window._ov = overlay; window._kin = kinAt;
S.install(st, setScene, (t) => overlay(((t % LOOP) + LOOP) % LOOP, kinAt(t)));
window.motionPx = (t, fps = 30) => { const pts = () => { const k = kinAt(t); return [pawlTip(k), scr(8.2, 0, 0, -k.ad), scr(0, 14, 0, -k.ad)]; };
  setScene(t); const A = pts(); setScene(t + 1 / fps); const B = pts(); let m = 0; for (let i = 0; i < A.length; i++) m = Math.max(m, Math.hypot(A[i][0] - B[i][0], A[i][1] - B[i][1])); return m; };
