<script type="module">
// p080 can opener "HOW DOES IT / CUT THE LID?" (group E, track A voice). Built from kit/kit.js.

  JAW.add(plate(J, 3.0, 6.0, M.ss, 0.9));
  const lh = [[0, -5], [5, -4.5], [120, -26], [121, -17.5], [4, 4]]; JAW.add(plate(lh, 3.0, 6.0, M.ss, 0.9));
  const grip = new THREE.Mesh(new K.RBox(70, 10, 9, 4, 4), M.grip); grip.position.set(84, -20.5, 4.5); grip.rotation.z = Math.atan2(-21.5, 116); JAW.add(grip);
  const boss = new THREE.Mesh(new K.RBox(4.3, 6.2, 7, 1.2, 3), M.ss); boss.position.set(29.65 - G.PIV[0], 2.3 - G.PIV[1], 1.5); JAW.add(boss);

  cw.rotation.z = Math.PI / 2; const CWG = new THREE.Group(); CWG.position.set(G.XC - G.PIV[0], G.YC - G.PIV[1], 0); CWG.add(cw); JAW.add(CWG); JAW.userData.cw = CWG;
  const piv = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 2.6, 14.5, 28), M.ss); piv.rotation.x = Math.PI / 2; JAW.add(piv); }
S.shadowAll(scene); SLIT.castShadow = false;

// ---------- kinematics ----------
const DT = 1 / G.FPS_K;

  M.slit.color.setHex(0x050506).lerp(new THREE.Color(0xff7a1a), Math.min(1, fade(t, T.vo4 + 0.2, T.vo5 + 0.4, 0.4)));
  K.shoot(st, CAMK, t);
}
// ---------- camera keys [t, tx, ty, tz, dist, elev, azim] (targets in WORLD-rotated coordinates) ----------

  k_(T.vo1 + 1.2, wp(32, -8), 360, 20, 14), k_(T.vo2 - 0.3, wp(32, -8), 350, 20, 14),
  k_(T.vo2 + 0.5, wp(38, -10), 120, -4, 53), k_(T.vo3 - 0.3, wp(38, -10), 114, -4, 51),
  k_(T.vo3 + 0.6, wp(30, -25), 400, 26, 20), k_(T.vo4 - 0.2, wp(30, -25), 390, 28, 18),
  k_(T.vo4 + 0.5, wp(20, -8), 270, 52, 10), k_(T.tb, wp(20, -8), 260, 54, 10),
  k_(T.vo5 + 0.6, wp(12, -16), 320, 40, 8), k_(LOOP, wp(11, -14), 305, 39, 6)];
// ---------- overlay ----------
const scrW = (x, y, z = 0) => S.toScreen(camera, V(x, y, z).applyAxisAngle(V(0, 1, 0), VIEW));
const scrCan = (r, a, y) => { const ph = KK ? KK[2] : 0; return scrW(r * Math.cos(a - ph), y, r * Math.sin(a - ph)); };  // a point fixed on the can at local angle a
function arcArrow(g2, a, cx, cy, R, a0, a1, ccwDir, color = '#ff7a1a', w = 13, sy = 1) { if (a <= 0) return; g2.save(); g2.globalAlpha = a; g2.translate(cx, cy); g2.scale(1, sy); g2.strokeStyle = color; g2.lineWidth = w; g2.lineCap = 'round';
