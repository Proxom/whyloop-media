<html><head><meta charset="utf-8">
<style>

<script type="importmap">{"imports":{"three":"/tools/render/node_modules/three/build/three.module.js","three/addons/":"/tools/render/node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
// p053 seatbelt Part 2: the vehicle sensor. y-up world, x = car forward (screen right), spool axis = +z (toward the camera).
// Lock wheel (24 sawtooth teeth) on the spool end; a small pendulum (brass bob + orange catch arm) hangs on a pin below it.
// All motion comes from kin_240.json (kin.py): car deceleration a(t) -> pendulum angle, spool angle, lock state.
import * as S from '/tools/render/lib/studio.js';
const THREE = S.THREE;
const here = location.pathname.replace(/[^/]*$/, '');
const geo = await (await fetch(here + 'geom.json')).json();
const kinT = await (await fetch(here + 'kin_240.json')).json();
const LOOP = geo.LOOP; const P = geo.P;

const st = S.makeStudio({ fov: 30, bg: 0x0b0e14, envIntensity: 0.95, bloom: 0, near: 2, far: 6000, samples: 0 });
st.renderer.toneMappingExposure = 1.1;
const { scene, camera } = st;

// ---------- materials ----------
const brush = (() => { const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d'); const r = S.rng(5); g.fillStyle = '#7a7a7a'; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 1600; i++) { const v = 122 + (r() - 0.5) * 26; g.strokeStyle = `rgba(${v | 0},${v | 0},${v | 0},0.5)`; g.lineWidth = 0.5 + r(); const y = r() * 512; g.beginPath(); g.moveTo(0, y); g.lineTo(512, y + (r() - 0.5) * 3); g.stroke(); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(0.04, 0.04); return t; })();
function webTex() { const c = document.createElement('canvas'); c.width = 256; c.height = 512; const g = c.getContext('2d'); g.fillStyle = '#50565f'; g.fillRect(0, 0, 256, 512);
  for (let y = -256; y < 768; y += 14) { g.strokeStyle = 'rgba(22,24,28,0.55)'; g.lineWidth = 5; g.beginPath(); g.moveTo(0, y); g.lineTo(256, y + 128); g.stroke(); }
  g.fillStyle = '#c9a227'; for (const y of [236, 268]) g.fillRect(0, y, 256, 8);
  g.fillStyle = '#2a2d33'; g.fillRect(0, 0, 14, 512); g.fillRect(242, 0, 14, 512); g.fillStyle = '#8a9099'; for (let y = 0; y < 512; y += 16) { g.fillRect(18, y, 3, 9); g.fillRect(235, y, 3, 9); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 16; return t; }
const M = {
  wheel: new THREE.MeshPhysicalMaterial({ color: 0xb8c0ca, metalness: 0.85, roughness: 0.3, roughnessMap: brush, clearcoat: 0.6, clearcoatRoughness: 0.06 }),
  wheelSide: new THREE.MeshPhysicalMaterial({ color: 0xd6dbe0, metalness: 1, roughness: 0.16 }),
  frame: new THREE.MeshPhysicalMaterial({ color: 0x8d939b, metalness: 1, roughness: 0.28, roughnessMap: brush, clearcoat: 0.3 }),
  frameSide: new THREE.MeshPhysicalMaterial({ color: 0xc8cdd3, metalness: 1, roughness: 0.22 }),
  housing: new THREE.MeshPhysicalMaterial({ color: 0x23272e, metalness: 0.2, roughness: 0.45, clearcoat: 0.6, clearcoatRoughness: 0.1 }),
  arm: new THREE.MeshPhysicalMaterial({ color: 0xff5a0a, metalness: 0.7, roughness: 0.24, clearcoat: 1.0, clearcoatRoughness: 0.06 }),
  bob: new THREE.MeshPhysicalMaterial({ color: 0xd9a845, metalness: 1, roughness: 0.14, clearcoat: 0.8, clearcoatRoughness: 0.05 }),
  chrome: new THREE.MeshPhysicalMaterial({ color: 0xe6e9ec, metalness: 1, roughness: 0.12, clearcoat: 0.4 }),
  roll: new THREE.MeshStandardMaterial({ map: webTex(), roughness: 0.85, metalness: 0 }),
  strap: new THREE.MeshStandardMaterial({ map: webTex(), roughness: 0.85, metalness: 0, side: THREE.DoubleSide }),
  gap: new THREE.MeshStandardMaterial({ color: 0x15171b, roughness: 0.7, metalness: 0.2 }),
  mark: new THREE.MeshStandardMaterial({ color: 0x3a3f46, roughness: 0.5 }),
};
const { shapeOf, circle, extrude, shadowAll, roundRect } = S;
const RW = 21.0, ZW0 = -44, ZW1 = -10, STRAP_L = 520;

// ---------- frame: back plate + base + sensor housing ----------
const frameG = new THREE.Group(); scene.add(frameG);
{ frameG.add(extrude(shapeOf(roundRect(-30, -48, 30, 30, 5).reverse(), [circle(0, 0, 7, 48)]), -52, -48, [M.frame, M.frameSide], 0.3, 16));
  const base = new THREE.Mesh(new THREE.BoxGeometry(60, 3.2, 47.2), M.frame); base.position.set(0, -49.6, -26.0); frameG.add(base);
  // sensor housing: dark bracket behind the pendulum, holding the pin; open at the front so the pendulum is visible
  const hs = shapeOf(roundRect(P[0] - 9.5, P[1] - 26, P[0] + 11.5, P[1] + 4.2, 4).reverse(), []);
  frameG.add(extrude(hs, -11, -7.6, [M.housing, M.housing], 0.4, 12));
  // a curved stop (cup lip) under the bob, part of the housing
  // swing guide: an arc concentric with the pin, 1.4 mm outside the bob's path (bob swings -10..+30 deg)
  const lip = new THREE.Mesh(new THREE.TorusGeometry(geo.LBOB + geo.RBOB + 1.4 + 1.0, 1.0, 12, 64, Math.PI * 0.5), M.housing); lip.rotation.z = -Math.PI / 2 - Math.PI * 0.25; lip.position.set(P[0], P[1], -6.4); frameG.add(lip);
  const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 0.85, 10.5, 24).rotateX(Math.PI / 2), M.chrome); pin.position.set(P[0], P[1], -4.0); frameG.add(pin);
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 0.6, 24).rotateX(Math.PI / 2), M.chrome); cap.position.set(P[0], P[1], 1.2); frameG.add(cap);
}
// ---------- spool: lock wheel (front) + webbing roll ----------
const spoolG = new THREE.Group(); scene.add(spoolG);
{ const gearPts = geo.gear.slice(0, -1).reverse();
  spoolG.add(extrude(shapeOf(gearPts, [circle(0, 0, 3.2, 32)]), -5.4, 0, [M.wheel, M.wheelSide], 0.15, 16));
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(6.0, 6.0, 1.6, 48).rotateX(Math.PI / 2), M.chrome); hub.position.z = 0.6; spoolG.add(hub);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(11.2, 0.35, 8, 96), M.gap); ring.position.z = 0.05; spoolG.add(ring);
  const mark = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 0.3, 24).rotateX(Math.PI / 2), M.mark); mark.position.set(8.6, 0, 0.18); spoolG.add(mark);
  const roll = new THREE.Mesh(new THREE.CylinderGeometry(RW, RW, ZW1 - ZW0, 128, 1, false).rotateX(Math.PI / 2), M.roll); roll.position.z = (ZW0 + ZW1) / 2; spoolG.add(roll);
  M.roll.map.repeat.set(1, 2); M.roll.map.rotation = Math.PI / 2;
  const fl = new THREE.Mesh(new THREE.CylinderGeometry(RW + 1.6, RW + 1.6, 1.2, 96).rotateX(Math.PI / 2), M.gap); fl.position.z = ZW1 + 0.7; spoolG.add(fl);
  const fl2 = fl.clone(); fl2.position.z = ZW0 - 0.7; spoolG.add(fl2);
  const axle = new THREE.Mesh(new THREE.CylinderGeometry(4.0, 4.0, 56, 48).rotateX(Math.PI / 2), M.chrome); axle.position.z = -24; spoolG.add(axle);
}
// ---------- pendulum: pivot group at P ----------
const pendG = new THREE.Group(); pendG.position.set(P[0], P[1], 0); scene.add(pendG);
{ const loc = geo.arm.slice(0, -1).map(p => [p[0] - P[0], p[1] - P[1]]);
  // shapely rings are CCW; three expects CW outer for our extrude helper -> reverse
  pendG.add(extrude(shapeOf(loc.slice().reverse(), [circle(0, 0, 0.95, 24)]), -4.4, -0.9, [M.arm, M.arm], 0.18, 12));
  const rod = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.0, geo.LBOB, 24), M.chrome); rod.position.set(0, -geo.LBOB / 2, -2.65); pendG.add(rod);
  const bob = new THREE.Mesh(new THREE.SphereGeometry(geo.RBOB, 64, 48), M.bob); bob.position.set(0, -geo.LBOB, -2.65); pendG.add(bob);
}
// free strap: leaves the roll on the left (x = -RW) and runs straight up
const strap = new THREE.Mesh(new THREE.PlaneGeometry(ZW1 - ZW0 - 2, STRAP_L), M.strap); strap.rotation.y = Math.PI / 2; strap.position.set(-RW - 0.05, STRAP_L / 2, (ZW0 + ZW1) / 2); scene.add(strap);
M.strap.map.repeat.set(1, STRAP_L / 60);
// ---------- backdrop: dark gradient + passing road-light streaks (scroll with the car's travel) ----------
{ const c = document.createElement('canvas'); c.width = c.height = 1024; const g = c.getContext('2d'); const gr = g.createRadialGradient(512, 430, 40, 512, 512, 700);
  gr.addColorStop(0, '#3a4250'); gr.addColorStop(0.45, '#1a1f28'); gr.addColorStop(1, '#07090d'); g.fillStyle = gr; g.fillRect(0, 0, 1024, 1024);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; const bd = new THREE.Mesh(new THREE.PlaneGeometry(4200, 4200), new THREE.MeshBasicMaterial({ map: t })); bd.position.z = -900; scene.add(bd); }
const streakTex = (() => { const c = document.createElement('canvas'); c.width = 1024; c.height = 512; const g = c.getContext('2d'); g.clearRect(0, 0, 1024, 512); const r = S.rng(11);
  for (let i = 0; i < 26; i++) { const y = 20 + r() * 472, x = r() * 1024, L = 90 + r() * 260, h = 2 + r() * 5; const a = 0.10 + r() * 0.22; const warm = r() < 0.35;
    for (const dx of [0, -1024, 1024]) { const gg = g.createLinearGradient(x + dx, 0, x + dx + L, 0); const col = warm ? '255,190,120' : '190,215,255';
      gg.addColorStop(0, `rgba(${col},0)`); gg.addColorStop(0.7, `rgba(${col},${a})`); gg.addColorStop(1, `rgba(${col},0)`); g.fillStyle = gg; g.fillRect(x + dx, y, L, h); } }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = THREE.RepeatWrapping; return t; })();
const streaks = new THREE.Mesh(new THREE.PlaneGeometry(2400, 1200), new THREE.MeshBasicMaterial({ map: streakTex, transparent: true, depthWrite: false, opacity: 0.9 }));
streaks.position.set(0, 40, -700); scene.add(streaks);
shadowAll(scene); strap.castShadow = true; streaks.castShadow = false; streaks.receiveShadow = false;
// ---------- lights ----------
const key = new THREE.DirectionalLight(0xfff0dc, 2.9); key.position.set(-140, 260, 300); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); { const c = key.shadow.camera; c.left = -90; c.right = 90; c.top = 120; c.bottom = -90; c.near = 150; c.far = 900; } key.shadow.bias = -0.0003; key.shadow.normalBias = 0.03; key.shadow.radius = 2;
scene.add(key, key.target);
const rim = new THREE.DirectionalLight(0xcfe0ff, 2.8); rim.position.set(260, 120, -160); scene.add(rim);
scene.add(new THREE.HemisphereLight(0xdde6ff, 0x2a2420, 0.28));
const soft = new THREE.DirectionalLight(0xfff0e0, 0.55); soft.position.set(-220, 60, 160); scene.add(soft);
const topL = new THREE.DirectionalLight(0xe8f0ff, 0.7); topL.position.set(60, 240, 120); scene.add(topL);

// ---------- animation ----------
function kinAt(t) { t = ((t % LOOP) + LOOP) % LOOP; const f = t * 240; const i = Math.floor(f), u = f - i; const A = kinT[Math.min(i, kinT.length - 1)], B = kinT[(i + 1) % kinT.length];
  const lerp = (k) => A[k] + (B[k] - A[k]) * u; let s = lerp('s'); if (i + 1 >= kinT.length) s = A.s + A.v * u / 240;
  return { phi: lerp('phi'), ag: lerp('ag'), a: A.a, v: lerp('v'), s, lock: A.lock, w: A.w }; }
const S_LOOP = kinT[kinT.length - 1].s + kinT[kinT.length - 1].v / 240; // car travel over one loop (scenery repeats seamlessly)
// camera: [t, tx, ty, tz, dist, elev, azim]
const CATCH = [10.5, -15.5, -2.5];
const KEYS = [
  [0.0, 4, -20, -18, 215, 13, -36],
  [2.6, 4, -20, -18, 208, 13, -34],
  [4.6, 6, -28, -4, 128, 9, -14],
  [6.2, 7, -26, -2, 100, 8, -8],
  [8.6, 7, -26, -2, 95, 8, -7],
  [10.2, 6, -27, -4, 112, 9, -10],
  [11.4, 6, -27, -4, 118, 9, -12],
  [13.2, 4, -20, -18, 210, 13, -34],
  [15.0, 4, -20, -18, 215, 13, -36],
];
const T_BRAKE = 2.7;
function setScene(t) { const k = kinAt(t);
  spoolG.rotation.z = k.ag; pendG.rotation.z = k.phi;
  M.strap.map.offset.y = (k.ag * RW) / 60; // belt moves up as the spool unwinds (clockwise = negative ag)
  streakTex.offset.x = ((k.s / S_LOOP) * 3) % 1; // 3 texture widths per loop, seamless
  const c = S.orbitCam(KEYS, t, LOOP);
  // braking jolt: the camera rides with the car, a short decaying nod when the brakes bite
  const tt = ((t % LOOP) + LOOP) % LOOP; const j = tt > T_BRAKE && tt < T_BRAKE + 1.2 ? Math.sin((tt - T_BRAKE) * 18) * Math.exp(-(tt - T_BRAKE) * 4) * 0.9 : 0;
  c.pos.y -= j; c.target.y -= j * 0.6;
  camera.position.copy(c.pos); camera.lookAt(c.target); camera.updateMatrixWorld(); return k; }
const scr = (x, y, z) => S.toScreen(camera, new THREE.Vector3(x, y, z));
const PE = 34 * Math.PI / 180;
const catchPt = (k) => { const c = Math.cos(k.phi - PE), s = Math.sin(k.phi - PE); const x = geo.T[0] - P[0], y = geo.T[1] - P[1]; return scr(P[0] + c * x - s * y, P[1] + s * x + c * y, -2.6); };
const bobPt = (k) => scr(P[0] + Math.sin(k.phi) * geo.LBOB, P[1] - Math.cos(k.phi) * geo.LBOB, -2.6);

// ---------- overlay ----------
await document.fonts.load('120px Anton');
const g2 = st.g2;
const win = (t, a, b, f = 0.18) => Math.max(0, Math.min(1, (t - a) / f, (b - t) / f));
function overlay(t, k) {
  S.vignette(g2, 560);
  const hookA = Math.max(0, Math.min(1, (2.35 - t) / 0.18), Math.min(1, (t - 14.82) / 0.16));
  if (hookA > 0) { g2.save(); g2.globalAlpha = hookA * 0.62; const bg = g2.createRadialGradient(S.CX, 560, 40, S.CX, 560, 420); bg.addColorStop(0, 'rgba(6,8,12,0.95)'); bg.addColorStop(0.6, 'rgba(6,8,12,0.6)'); bg.addColorStop(1, 'rgba(6,8,12,0)'); g2.fillStyle = bg; g2.fillRect(0, 300, 1080, 560); g2.restore();
    S.hookCard(g2, hookA, 'BRAKE HARD.', 'WHAT LOCKS?', 116); const [x, y] = bobPt(k); S.redCircle(g2, hookA, x, y, 62, [-230, 170]); }
  let a;
  if ((a = win(t, 2.7, 3.9, 0.08)) > 0) S.label(g2, a, 'BRAKE!', null, null, 430, 110);
  if ((a = win(t, 4.0, 5.3)) > 0) { S.label(g2, a, 'PENDULUM SWINGS FORWARD', null, null, 430, 70); }
  if ((a = win(t, 3.0, 6.6)) > 0 && k.a > 0.05) { const [x, y] = bobPt(k); S.forceArrow(g2, a * Math.min(1, k.a / 0.4), x + 30, y, x + 190, y, 30); }
  if ((a = win(t, 5.4, 6.95)) > 0) S.label(g2, a, 'CATCH INTO THE TEETH', null, null, 430, 74);
  if ((a = win(t, 7.08, 8.85)) > 0) { S.label(g2, a, 'LOCKED', null, null, 430, 96); const p = catchPt(k); S.redCircle(g2, a, p[0], p[1], 48, [-170, 150]); }
  if ((a = win(t, 9.0, 10.55)) > 0) S.label(g2, a, 'STOPPED. BELT GOES SLACK', null, null, 430, 68);
  if ((a = win(t, 10.7, 12.3)) > 0) S.label(g2, a, 'IT LETS GO', null, null, 430, 88);
  if ((a = win(t, 13.4, 14.8)) > 0) { g2.save(); g2.globalAlpha = a; S.outlined(g2, 'FOLLOW → NEW MACHINE TOMORROW', S.CX, 1400, 50, '#ffffff'); g2.restore(); }
}
window._st = st; window._set = setScene; window._ov = overlay; window._kin = kinAt;
S.install(st, setScene, (t) => overlay(((t % LOOP) + LOOP) % LOOP, kinAt(t)));
window.motionPx = (t, fps = 30) => { const pts = () => { const k = kinAt(t); return [catchPt(k), bobPt(k), scr(8.6 * Math.cos(k.ag), 8.6 * Math.sin(k.ag), 0)]; };
  setScene(t); const A = pts(); setScene(t + 1 / fps); const B = pts(); let m = 0; for (let i = 0; i < A.length; i++) m = Math.max(m, Math.hypot(A[i][0] - B[i][0], A[i][1] - B[i][1])); return m; };
</script></body></html>
