<script type="module">
// p082 self-cancelling turn signal "WHO TURNS / THE BLINKER OFF?" (group V, track A voice). Built from kit/kit.js.
// mm, view down the steering column (axis z toward the driver/camera). kin.json rows: [t, wheel theta deg (CCW+), lever phi deg (CW+ = stalk up), finger fold beta deg, signal on]
import * as K from '/kit/kit.js';
const { THREE, S } = K;
const G = await (await fetch('geom.json')).json();

const LOOP = G.LOOP, T = G.T, D2R = Math.PI / 180;
const st = K.makeKit({ fov: 30, bg: 0x15171b, envIntensity: 1.05, near: 1, far: 20000 });
const { scene, camera } = st;
const M = K.materials();
const phys = (o) => new THREE.MeshPhysicalMaterial(o);

K.contactBlob(scene, 0, -230, -80, 120, 0.6);

RIG.key.shadow.bias = -0.0004; RIG.key.shadow.normalBias = 0.1;
{ const f = new THREE.DirectionalLight(0xfff1e0, 0.6); f.position.set(-200, 300, 800); scene.add(f);
  RIG.rim.intensity = 3.0; const g = new THREE.DirectionalLight(0xdbe8ff, 2.2); g.position.set(260, 140, 90); scene.add(g); const g2 = new THREE.DirectionalLight(0xfff0e0, 1.2); g2.position.set(-220, 200, 60); scene.add(g2); }

// ---------- column shroud (behind) + floor stand so the column does not float ----------
{ const sh = new THREE.Mesh(new THREE.CylinderGeometry(70, 70, 240, 96), M.shroud); sh.rotation.x = Math.PI / 2; sh.position.z = -132; scene.add(sh);
  const face = new THREE.Mesh(new THREE.RingGeometry(12, 70, 96), M.shroud); face.position.z = -12.5; scene.add(face);

  const pts = []; for (let i = 0; i < 360; i++) { let r = G.RB; for (const c of G.LOBES) { const x = ((i - c + 540) % 360) - 180; if (Math.abs(x) < G.LW) r = Math.max(r, G.RB + G.H * Math.cos(Math.PI / 2 * x / G.LW) ** 2); } pts.push([r * Math.cos(i * D2R), r * Math.sin(i * D2R)]); }
  const hole = []; for (let i = 0; i < 64; i++) hole.push([10.2 * Math.cos(-i / 64 * 2 * Math.PI), 10.2 * Math.sin(-i / 64 * 2 * Math.PI)]);

const rel = (x, y) => [x - G.P[0], y - G.P[1]];
{ const band = []; const a0 = 222, a1 = 84, ri = 43, ro = 50;
  for (let a = a0; a >= a1; a -= 2) band.push(rel(ro * Math.cos(a * D2R), ro * Math.sin(a * D2R)));
  band.push(rel(8, 50), rel(8, 42));
  for (let a = a1; a <= a0; a += 2) band.push(rel(ri * Math.cos(a * D2R), ri * Math.sin(a * D2R)));
  const b = S.extrude(S.shapeOf(band), -4, 4, M.acetal, 0.9, 4); ACT.add(b);
  { const e = []; for (let a = a0; a >= a1; a -= 2) e.push(rel(ro * Math.cos(a * D2R), ro * Math.sin(a * D2R))); const c = new THREE.CatmullRomCurve3(e.map(p => V(p[0], p[1], 4.6))); const tb = new THREE.Mesh(new THREE.TubeGeometry(c, 80, 0.7, 8), M.chrome); ACT.add(tb); }
  const boss = new THREE.Mesh(new THREE.CylinderGeometry(9, 9, 12, 48), M.acetal); boss.rotation.x = Math.PI / 2; ACT.add(boss);
  const pin = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.2, 16, 32), M.chrome); pin.rotation.x = Math.PI / 2; ACT.add(pin);
  const ball = new THREE.Mesh(new THREE.SphereGeometry(2.6, 32, 16), M.chrome); ball.position.set(-15, 0, 5); ACT.add(ball);

  const STK = new THREE.Group(); ACT.add(STK);
  const L = 250; const prof = [[0, 0], [8.5, 0], [8, 40], [7.2, 170], [8.6, 196], [10.5, 232], [10.5, 245], [0, L]];
  const s = new THREE.Mesh(new THREE.LatheGeometry(prof.map(p => new THREE.Vector2(p[0], p[1])), 48), M.gloss); STK.add(s);
  const ring = new THREE.Mesh(new THREE.CylinderGeometry(8.9, 8.9, 8, 48), M.chrome); ring.position.y = 196; STK.add(ring);
  STK.rotation.z = Math.PI / 2; STK.rotateX(-0.12); }
// detent plate (fixed): three notches at phi = -12, 0, +12 for the ball at radius 15 (left of the pivot)
{ const pl = []; const N = 120; for (let i = 0; i <= N; i++) { const a = (150 + 60 * i / N); let r = 12.4; for (const n of [168, 180, 192]) { const d = Math.abs(a - n); if (d < 3.2) r = Math.max(r, 12.4) + 0 - (3.2 - d) * 0.0; } pl.push([r * Math.cos(a * D2R), r * Math.sin(a * D2R)]); }

  for (let i = N; i >= 0; i--) { const a = 150 + 60 * i / N; ring.push([9.6 * Math.cos(a * D2R), 9.6 * Math.sin(a * D2R)]); }
  const dp = S.extrude(S.shapeOf(ring), 2, 7, M.brass, 0.3, 2); dp.position.set(G.P[0], G.P[1], 0); scene.add(dp); }

const FG = new THREE.Group(); { const [hx, hy] = rel(G.HNG0[0], G.HNG0[1]); FG.position.set(hx, hy, 8.4); ACT.add(FG);
  const blade = new THREE.Mesh(new K.RBox(3.4, G.LF + 2, 7, 3, 0.8), M.brass); blade.position.y = -(G.LF + 2) / 2 + 1; FG.add(blade);
  const hp = new THREE.Mesh(new THREE.CylinderGeometry(1.9, 1.9, 22, 24), M.chrome); hp.position.z = -4; hp.rotation.x = Math.PI / 2; FG.add(hp); }
// ---------- steering wheel (in front, turns with theta) ----------
const WH = new THREE.Group(); WH.position.z = 70; scene.add(WH);
const WM = [];
{ const rim = new THREE.Mesh(new THREE.TorusGeometry(185, 15, 32, 160), M.leather.clone()); WH.add(rim); WM.push(rim);
  const hub = new THREE.Mesh(new K.RBox(130, 110, 40, 6, 18), M.gloss.clone()); hub.position.z = 10; WH.add(hub); WM.push(hub);
  const logo = new THREE.Mesh(new THREE.TorusGeometry(18, 2.6, 16, 64), M.chrome.clone()); logo.position.z = 31; WH.add(logo); WM.push(logo);
  const pad = new THREE.Mesh(new THREE.CylinderGeometry(17, 17, 2, 48), M.plastic.clone()); pad.rotation.x = Math.PI / 2; pad.position.z = 30.5; WH.add(pad); WM.push(pad);
  for (const a of [20, 160, 270]) { const sp = new THREE.Mesh(new K.RBox(130, 34, 16, 4, 6), M.gloss.clone()); const r = 118; sp.position.set(r * Math.cos(a * D2R), r * Math.sin(a * D2R), 0); sp.rotation.z = a * D2R; WH.add(sp); WM.push(sp); }
  const mark = new THREE.Mesh(new THREE.TorusGeometry(185, 16.3, 24, 24, 0.12), phys({ color: 0xd8261c, roughness: 0.5 })); mark.rotation.z = Math.PI / 2 - 0.06; WH.add(mark); WM.push(mark);
  for (const m of WM) { m.material.transparent = true; } }
S.shadowAll(scene);

// ---------- kinematics ----------
const DT = 1 / G.FPS_K;
function kin(t) { t = Math.max(0, Math.min(LOOP - 1e-6, t)); const i = Math.min(KN.length - 2, Math.floor(t / DT)), u = (t - KN[i][0]) / DT; const a = KN[i], b = KN[i + 1]; return a.map((v, j) => j === 4 ? a[4] : v + (b[j] - v) * u); }
const fade = (t, a, b, f = 0.25) => Math.min(S.smooth((t - a) / f), 1 - S.smooth((t - b + f) / f));
const wheelA = (t) => t < T.hookEnd ? 0.0 : (t < T.vo1 + 1.0 ? 1 : (t < T.vo1 + 1.9 ? 1 - S.smooth((t - T.vo1 - 1.0) / 0.9) : (t < T.vo6 - 0.2 ? 0 : S.smooth((t - T.vo6 + 0.2) / 1.0))));
let KK = null;
function setScene(t) {
  const k = KK = kin(t); const th = k[1] * D2R, phi = k[2] * D2R, beta = k[3] * D2R;
  ROT.rotation.z = th; WH.rotation.z = th; ACT.rotation.z = -phi; FG.rotation.z = beta;
  const wa = wheelA(t); for (const m of WM) { m.material.opacity = wa; m.material.depthWrite = wa > 0.99; } WH.visible = wa > 0.01;
  const lob = Math.max(fade(t, T.vo2 + 2.4, T.vo3 + 0.2, 0.3) * 0.55, fade(t, T.touch - 0.3, T.snap + 0.4, 0.2) * 0.6);
  K.glow(ROT.userData.cam, lob);
  K.glow(FG, Math.max(fade(t, T.vo2 + 0.9, T.vo3 + 0.2, 0.3), fade(t, T.turn_a + 0.6, T.turn_b, 0.25), fade(t, T.touch - 0.3, T.snap + 0.3, 0.2)) * 0.9);
  K.shoot(st, CAMK, t);
}
// ---------- camera keys [t, tx, ty, tz, dist, elev, azim] ----------
const k_ = (t, a) => [t, ...a];
const MAC = [-3, 6, 0, 405, 8, 10], MID = [-6, 3, 0, 600, 8, 10], WIDE = [-22, -45, 20, 2000, 9, 10];
const CAMK = [k_(0, MID), k_(T.hookEnd - 0.01, [-6, 5, 0, 585, 8, 10]),
  k_(T.hookEnd, WIDE), k_(T.vo1 + 1.0, [-22, -45, 20, 1940, 9, 10]), k_(T.vo1 + 2.0, MID), k_(T.vo2 + 0.4, [-6, 5, 0, 585, 8, 10]),
  k_(T.vo2 + 1.7, MAC), k_(T.vo3, [-3, 6, 0, 400, 8, 10]), k_(T.vo5 + 1.2, [-3, 6, 0, 415, 8, 11]),
  k_(T.vo5 + 1.6, MID), k_(T.vo6 + 0.2, [-6, 3, 0, 620, 8, 10]), k_(T.vo6 + 1.4, WIDE), k_(LOOP, [-22, -45, 20, 1960, 9, 10])];
// ---------- overlay ----------
const scr = (x, y, z = 0) => S.toScreen(camera, V(x, y, z));
const wpt = (obj, x, y, z = 0) => K.screenOf(st, obj, x, y, z);
function arcArrow(g2, a, cx, cy, R, a0, a1, ccwDir, color = '#ff7a1a', w = 13) { if (a <= 0) return; g2.save(); g2.globalAlpha = a; g2.strokeStyle = color; g2.lineWidth = w; g2.lineCap = 'round';
  g2.beginPath(); g2.arc(cx, cy, R, a0, a1, ccwDir); g2.stroke(); const ex = cx + R * Math.cos(a1), ey = cy + R * Math.sin(a1), tg = a1 + (ccwDir ? -1 : 1) * Math.PI / 2;
  g2.fillStyle = color; g2.beginPath(); g2.moveTo(ex + 30 * Math.cos(tg), ey + 30 * Math.sin(tg)); g2.lineTo(ex + 20 * Math.cos(tg + 2.2), ey + 20 * Math.sin(tg + 2.2)); g2.lineTo(ex + 20 * Math.cos(tg - 2.2), ey + 20 * Math.sin(tg - 2.2)); g2.closePath(); g2.fill(); g2.restore(); }
function blinker(g2, a, on, off, x, y) { if (a <= 0) return; g2.save(); g2.globalAlpha = a; g2.fillStyle = 'rgba(8,10,14,0.9)'; S.rrect(g2, x - 120, y - 52, 240, 104, 22); g2.fill(); g2.strokeStyle = on ? '#3dff6e' : '#4a5059'; g2.lineWidth = 4; g2.stroke();
  g2.save(); g2.translate(x - (off > 0 ? 40 : 0), y); g2.fillStyle = on ? '#3dff6e' : '#26332a'; if (on) { g2.shadowColor = '#3dff6e'; g2.shadowBlur = 30; }
  const k = off > 0 ? 0.7 : 1; g2.scale(k, k); g2.beginPath(); g2.moveTo(58, 0); g2.lineTo(8, -38); g2.lineTo(8, -16); g2.lineTo(-58, -16); g2.lineTo(-58, 16); g2.lineTo(8, 16); g2.lineTo(8, 38); g2.closePath(); g2.fill(); g2.restore();
  if (off > 0) { g2.globalAlpha = a * off; S.outlined(g2, 'OFF', x + 58, y + 2, 54, '#ffffff'); } g2.restore(); }
function wheelIcon(g2, a, x, y, R, th, dir) { if (a <= 0) return; g2.save(); g2.globalAlpha = a; g2.fillStyle = 'rgba(8,10,14,0.85)'; g2.beginPath(); g2.arc(x, y, R + 22, 0, 7); g2.fill(); g2.strokeStyle = '#4a5059'; g2.lineWidth = 3; g2.stroke();
  g2.save(); g2.translate(x, y); g2.rotate(-th);
  g2.strokeStyle = '#e8e8e8'; g2.lineWidth = 12; g2.beginPath(); g2.arc(0, 0, R, 0, 7); g2.stroke(); g2.lineWidth = 10; for (const s of [-0.35, Math.PI + 0.35, Math.PI / 2]) { g2.beginPath(); g2.moveTo(0, 0); g2.lineTo(R * Math.cos(s), R * Math.sin(s)); g2.stroke(); }
  g2.fillStyle = '#e8e8e8'; g2.beginPath(); g2.arc(0, 0, 14, 0, 7); g2.fill(); g2.strokeStyle = '#d8261c'; g2.lineWidth = 13; g2.beginPath(); g2.arc(0, 0, R, -Math.PI / 2 - 0.16, -Math.PI / 2 + 0.16); g2.stroke(); g2.restore();
  if (dir) arcArrow(g2, 1, x, y, R + 34, dir > 0 ? -2.3 : -0.84, dir > 0 ? -0.84 : -2.3, dir < 0, dir > 0 ? '#ffd21f' : '#ff7a1a', 9);
  g2.restore(); }
function overlay(t) {
  const g2 = st.g2; S.vignette(g2, 0); const k = KK || kin(t); const th = k[1] * D2R, sig = k[4] > 0.5, beta = k[3];
  const H = (a, b) => fade(t, a, b, 0.08);                      // hard cuts for captions and tags (no see-through ghosts)
  { const fx = Math.max(0, 1 - Math.abs(t - T.hookEnd) / 0.12); K.TXT.flash(g2, 0.75 * fx); }
  const hk = t < 4 ? 1 - S.smooth((t - (T.vo1 - 0.3)) / 0.2) : 0;
  const blinkOn = sig && ((t * 1.6) % 1) < 0.55;
  if (hk > 0) { K.TXT.hook(g2, hk, 'WHO TURNS', 'THE BLINKER OFF?', 104); const [cx0, cy0] = wpt(FG, 0, -4, 0); K.TXT.circle(g2, hk * (t < T.hookEnd ? 1 : 0), cx0, cy0, 70, [-230, 230]); }

  wheelIcon(g2, H(T.vo2 + 1.6, T.vo6 + 0.1), 690, 1364, 46, th, dir);
  const s1 = H(T.vo1 - 0.1, T.vo2 - 0.02), s2 = H(T.vo2, T.vo3 - 0.02), s3 = H(T.vo3, T.vo4 - 0.02), s4 = H(T.vo4, T.vo5 - 0.02), s5 = H(T.vo5, T.vo6 - 0.02);
  K.TXT.step(g2, s1, 1, 'A NOTCH HOLDS THE LEVER', 58);
  K.TXT.step(g2, s2, 2, 'A FINGER MEETS A BUMPY RING', 58);
  K.TXT.step(g2, s3, 3, 'TURN RIGHT: THE FINGER FOLDS', 56);
  K.TXT.step(g2, s4, 4, "TURN BACK: IT CAN'T FOLD", 58);
  K.TXT.step(g2, s5, 5, 'THE LEVER GETS KNOCKED HOME', 56);
  // stalk up arrow + tags (each >= 2.5 s at full opacity)
  { const a = H(T.vo1 + 0.2, T.vo1 + 1.9); if (a > 0) { const [sx, sy] = wpt(ACT, -205, 0, 0); S.forceArrow(g2, a, sx, sy + 70, sx, sy - 90, 16); } }
  S.tag(g2, H(T.vo1 + 0.3, T.vo1 + 2.9), 'LEVER UP', ...wpt(ACT, -150, 0, 0), 40, -170, 50, '#ffffff');
  S.tag(g2, H(T.vo1 + 1.9, T.vo2 + 1.6), 'NOTCH', ...wpt(ACT, -15, 0, 5), 170, 190, 52, '#ffd21f');
  S.tag(g2, H(T.vo2 + 1.4, T.vo3 + 0.6), 'FINGER', ...wpt(FG, 0, -6, 4), 150, -120, 52, '#ffd21f');
  S.tag(g2, H(T.vo2 + 1.9, T.vo3 + 0.6), 'BUMP', ...wpt(ROT, 31 * Math.cos(210 * D2R), 31 * Math.sin(210 * D2R), 6), 120, 260, 52, '#ffffff');
  // while turning right: the bump that meets the finger + the fold angle
  { const lob = 210 * D2R + th; const [bx, by] = scr(31 * Math.cos(lob), 31 * Math.sin(lob), 6);
    S.tag(g2, H(T.turn_a + 1.0, T.vo4 + 0.2) * (Math.sin(lob) > 0.2 ? 1 : 0), 'BUMP', bx, by, -200, 230, 50, '#ffffff'); }
  S.tag(g2, H(T.turn_a + 0.2, T.vo4 + 0.1), 'FOLDS', ...wpt(FG, 0, -8, 4), 170, -125, 52, '#ffd21f');
  { const a = H(T.turn_a + 0.2, T.vo4 + 0.1); if (a > 0 && beta > 1) { const [hx, hy] = wpt(FG, 0, 0, 4), [tx, ty] = wpt(ACT, ...rel(G.HNG0[0], G.HNG0[1] - G.LF), 4);
      const R0 = Math.hypot(tx - hx, ty - hy) * 1.1, a0 = Math.atan2(ty - hy, tx - hx); g2.save(); g2.globalAlpha = a; g2.strokeStyle = '#ffd21f'; g2.lineWidth = 7; g2.setLineDash([12, 8]);
      g2.beginPath(); g2.moveTo(hx, hy); g2.lineTo(hx + R0 * Math.cos(a0), hy + R0 * Math.sin(a0)); g2.stroke(); g2.setLineDash([]); g2.beginPath(); g2.arc(hx, hy, R0 * 0.8, a0, a0 - beta * D2R, true); g2.stroke(); g2.restore(); } }

  const [cx, cy] = scr(0, 0, 0), [ex] = scr(40, 0, 0); const RR = Math.abs(ex - cx);
  arcArrow(g2, H(T.turn_a, T.turn_b), cx, cy, RR * 1.05, -Math.PI * 0.95, -Math.PI * 0.25, false, '#ffd21f', 12);
  arcArrow(g2, H(T.back_a, T.snap + 0.25), cx, cy, RR * 1.05, -Math.PI * 0.2, -Math.PI * 0.8, true, '#ff7a1a', 12);
  { const a = H(T.touch - 0.1, T.snap + 0.2); if (a > 0) { const [fx, fy] = wpt(FG, 0, -9, 4); S.forceArrow(g2, a, fx + 120, fy + 10, fx + 12, fy - 4, 15); } }
  S.tag(g2, H(T.vo4 + 0.2, T.snap + 0.3), 'STOP BLOCKS IT', ...wpt(ACT, ...rel(-3.0, 41.5), 10), -260, -110, 48, '#ff7a1a');
  K.TXT.answer(g2, H(T.vo6 + 0.05, LOOP - 1.6), 'TURNING BACK', 'KNOCKS THE LEVER HOME', 560);
  K.TXT.follow(g2, H(LOOP - 1.55, LOOP + 1));
}
window.motionPx = (t) => 0;
S.install(st, setScene, overlay); window.ready = false;
await document.fonts.load('40px Anton');
window.ready = true;
</script></body></html>
