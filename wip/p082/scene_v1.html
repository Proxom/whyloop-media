<script type="module">
// p082 self-cancelling turn signal "WHO TURNS / THE BLINKER OFF?" (group V, track A voice). Built from kit/kit.js.
// mm, view down the steering column (axis z toward the driver/camera). kin.json rows: [t, wheel theta deg (CCW+), lever phi deg (CW+ = stalk up), finger fold beta deg, signal on]
import * as K from '/kit/kit.js';
const { THREE, S } = K;

const LOOP = G.LOOP, T = G.T, D2R = Math.PI / 180;

{ const f = new THREE.DirectionalLight(0xfff1e0, 0.6); f.position.set(-200, 300, 800); scene.add(f); }

// ---------- column shroud (behind) + floor stand so the column does not float ----------
{ const sh = new THREE.Mesh(new THREE.CylinderGeometry(70, 70, 400, 96), M.shroud); sh.rotation.x = Math.PI / 2; sh.position.z = -212; scene.add(sh);
  const face = new THREE.Mesh(new THREE.RingGeometry(12, 70, 96), M.shroud); face.position.z = -12.5; scene.add(face);
  const lip = new THREE.Mesh(new THREE.TorusGeometry(70, 2.2, 16, 96), M.plastic); lip.position.z = -12.5; scene.add(lip);
  const sw = new THREE.Mesh(new K.RBox(120, 26, 30, 4, 3), M.shroud); sw.position.set(-90, -30, -26); scene.add(sw); }
// ---------- shaft + cancel cam (turns with the wheel) ----------
const ROT = new THREE.Group(); scene.add(ROT);
{ const sf = K.shaft(M.chrome, { d: 20, L: 120 }); sf.position.z = -40; ROT.add(sf);
  const key = new THREE.Mesh(new THREE.BoxGeometry(4, 6, 40), M.steel); key.position.set(0, 10, 12); ROT.add(key);
  const pts = []; for (let i = 0; i < 360; i++) { let r = G.RB; for (const c of G.LOBES) { const x = ((i - c + 540) % 360) - 180; if (Math.abs(x) < G.LW) r = Math.max(r, G.RB + G.H * Math.cos(Math.PI / 2 * x / G.LW) ** 2); } pts.push([r * Math.cos(i * D2R), r * Math.sin(i * D2R)]); }
  const hole = []; for (let i = 0; i < 64; i++) hole.push([10.2 * Math.cos(-i / 64 * 2 * Math.PI), 10.2 * Math.sin(-i / 64 * 2 * Math.PI)]);
  const cam = S.extrude(S.shapeOf(pts, [hole]), -6, 6, M.nylon, 0.8, 4); ROT.add(cam); ROT.userData.cam = cam;
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(19, 19, 10, 64), M.nylon); hub.rotation.x = Math.PI / 2; hub.position.z = -11; ROT.add(hub); }

const rel = (x, y) => [x - G.P[0], y - G.P[1]];
{ const band = []; const a0 = 222, a1 = 84, ri = 43, ro = 50;
  for (let a = a0; a >= a1; a -= 2) band.push(rel(ro * Math.cos(a * D2R), ro * Math.sin(a * D2R)));
  band.push(rel(8, 50), rel(8, 42));
  for (let a = a1; a <= a0; a += 2) band.push(rel(ri * Math.cos(a * D2R), ri * Math.sin(a * D2R)));
  const b = S.extrude(S.shapeOf(band), -4, 4, M.acetal, 0.6, 3); ACT.add(b);
  const boss = new THREE.Mesh(new THREE.CylinderGeometry(9, 9, 12, 48), M.acetal); boss.rotation.x = Math.PI / 2; ACT.add(boss);
  const pin = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.2, 16, 32), M.chrome); pin.rotation.x = Math.PI / 2; ACT.add(pin);
  const ball = new THREE.Mesh(new THREE.SphereGeometry(2.6, 32, 16), M.chrome); ball.position.set(-15, 0, 5); ACT.add(ball);
  const stop = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.4, 9, 20), M.steel); stop.rotation.x = Math.PI / 2; const [sx, sy] = rel(-2.6, 41.5); stop.position.set(sx, sy, 2); ACT.add(stop);
  // stalk: from the pivot out to the left, slightly toward the driver, black gloss with a chrome ring and a rubber end
  const STK = new THREE.Group(); ACT.add(STK);
  const L = 250; const prof = [[0, 0], [8.5, 0], [8, 40], [7.2, 170], [8.6, 196], [10.5, 232], [10.5, 245], [0, L]];
  const s = new THREE.Mesh(new THREE.LatheGeometry(prof.map(p => new THREE.Vector2(p[0], p[1])), 48), M.gloss); STK.add(s);
  const ring = new THREE.Mesh(new THREE.CylinderGeometry(8.9, 8.9, 8, 48), M.chrome); ring.position.y = 196; STK.add(ring);
  STK.rotation.z = Math.PI / 2; STK.rotateX(-0.12); }
// detent plate (fixed): three notches at phi = -12, 0, +12 for the ball at radius 15 (left of the pivot)
{ const pl = []; const N = 120; for (let i = 0; i <= N; i++) { const a = (150 + 60 * i / N); let r = 12.4; for (const n of [168, 180, 192]) { const d = Math.abs(a - n); if (d < 3.2) r = Math.max(r, 12.4) + 0 - (3.2 - d) * 0.0; } pl.push([r * Math.cos(a * D2R), r * Math.sin(a * D2R)]); }
  // notch ring: plate edge with V notches at radius ~12.4..13.4 where the ball (r 2.6 at 15) sits
  const ring = []; for (let i = 0; i <= N; i++) { const a = 150 + 60 * i / N; let r = 13.6; for (const n of [168, 180, 192]) { const d = Math.abs(a - n); if (d < 6) r = Math.min(r, 12.4 + d * 0.2); } ring.push([r * Math.cos(a * D2R), r * Math.sin(a * D2R)]); }
  for (let i = N; i >= 0; i--) { const a = 150 + 60 * i / N; ring.push([9.6 * Math.cos(a * D2R), 9.6 * Math.sin(a * D2R)]); }
  const dp = S.extrude(S.shapeOf(ring), 2, 7, M.brass, 0.3, 2); dp.position.set(G.P[0], G.P[1], 0); scene.add(dp); }
// finger (brass blade) hinged on the actuator
const FG = new THREE.Group(); { const [hx, hy] = rel(G.HNG0[0], G.HNG0[1]); FG.position.set(hx, hy, 0); ACT.add(FG);
  const blade = new THREE.Mesh(new K.RBox(3.4, G.LF + 2, 7, 3, 0.8), M.brass); blade.position.y = -(G.LF + 2) / 2 + 1; FG.add(blade);
  const hp = new THREE.Mesh(new THREE.CylinderGeometry(1.9, 1.9, 10, 24), M.chrome); hp.rotation.x = Math.PI / 2; FG.add(hp); }
// ---------- steering wheel (in front, turns with theta) ----------
const WH = new THREE.Group(); WH.position.z = 70; scene.add(WH);
const WM = [];
{ const rim = new THREE.Mesh(new THREE.TorusGeometry(185, 15, 32, 160), M.leather.clone()); WH.add(rim); WM.push(rim);
  const hub = new THREE.Mesh(new K.RBox(130, 110, 40, 6, 18), M.gloss.clone()); hub.position.z = 10; WH.add(hub); WM.push(hub);
  const logo = new THREE.Mesh(new THREE.CylinderGeometry(16, 16, 3, 48), M.chrome.clone()); logo.rotation.x = Math.PI / 2; logo.position.z = 31; WH.add(logo); WM.push(logo);
  for (const a of [20, 160, 270]) { const sp = new THREE.Mesh(new K.RBox(130, 34, 16, 4, 6), M.gloss.clone()); const r = 118; sp.position.set(r * Math.cos(a * D2R), r * Math.sin(a * D2R), 0); sp.rotation.z = a * D2R; WH.add(sp); WM.push(sp); }
  const mark = new THREE.Mesh(new THREE.TorusGeometry(185, 15.4, 16, 24, 0.12), phys({ color: 0xd8261c, roughness: 0.5 })); mark.rotation.z = Math.PI / 2 - 0.06; WH.add(mark); WM.push(mark);
  for (const m of WM) { m.material.transparent = true; } }
S.shadowAll(scene);

// ---------- kinematics ----------
const DT = 1 / G.FPS_K;
function kin(t) { t = Math.max(0, Math.min(LOOP - 1e-6, t)); const i = Math.min(KN.length - 2, Math.floor(t / DT)), u = (t - KN[i][0]) / DT; const a = KN[i], b = KN[i + 1]; return a.map((v, j) => j === 4 ? a[4] : v + (b[j] - v) * u); }
const fade = (t, a, b, f = 0.25) => Math.min(S.smooth((t - a) / f), 1 - S.smooth((t - b + f) / f));
const wheelA = (t) => t < T.hookEnd ? 0.0 : (t < T.vo1 + 1.0 ? 1 : (t < T.vo1 + 1.9 ? 1 - S.smooth((t - T.vo1 - 1.0) / 0.9) : (t < T.vo6 - 0.2 ? 0 : S.smooth((t - T.vo6 + 0.2) / 1.0))));
let KK = null;
function setScene(t) {
  const k = KK = kin(t); const th = k[1] * D2R, phi = k[2] * D2R, beta = k[3] * D2R;
  ROT.rotation.z = th; WH.rotation.z = th; ACT.rotation.z = -phi; FG.rotation.z = beta;
  const wa = wheelA(t); for (const m of WM) { m.material.opacity = wa; m.material.depthWrite = wa > 0.99; } WH.visible = wa > 0.01;
  const lob = Math.max(fade(t, T.vo2 + 2.4, T.vo3 + 0.2, 0.3) * 0.55, fade(t, T.touch - 0.3, T.snap + 0.4, 0.2) * 0.6);
  K.glow(ROT.userData.cam, lob);
  K.glow(FG, Math.max(fade(t, T.vo2 + 0.9, T.vo3 + 0.2, 0.3), fade(t, T.turn_a + 0.6, T.turn_b, 0.25), fade(t, T.touch - 0.3, T.snap + 0.3, 0.2)) * 0.9);
  K.shoot(st, CAMK, t);
}
// ---------- camera keys [t, tx, ty, tz, dist, elev, azim] ----------
const k_ = (t, a) => [t, ...a];
const MAC = [-10, 10, 0, 430, 8, 14], MID = [-40, 0, 0, 620, 8, 16], WIDE = [-100, -20, 20, 1350, 10, 20];
const CAMK = [k_(0, MID), k_(T.hookEnd - 0.01, [-38, 2, 0, 600, 8, 16]),
  k_(T.hookEnd, WIDE), k_(T.vo1 + 1.0, [-100, -18, 20, 1300, 10, 20]), k_(T.vo1 + 2.0, MID), k_(T.vo2 + 0.4, [-38, 2, 0, 600, 8, 16]),
  k_(T.vo2 + 1.7, MAC), k_(T.vo3, [-8, 10, 0, 420, 8, 13]), k_(T.vo5 + 1.2, [-10, 10, 0, 440, 8, 15]),
  k_(T.vo5 + 1.6, MID), k_(T.vo6 + 0.2, [-40, 0, 0, 640, 8, 16]), k_(T.vo6 + 1.4, WIDE), k_(LOOP, [-100, -20, 20, 1330, 10, 20])];
// ---------- overlay ----------
const scr = (x, y, z = 0) => S.toScreen(camera, V(x, y, z));
const wpt = (obj, x, y, z = 0) => K.screenOf(st, obj, x, y, z);
function arcArrow(g2, a, cx, cy, R, a0, a1, ccwDir, color = '#ff7a1a', w = 13) { if (a <= 0) return; g2.save(); g2.globalAlpha = a; g2.strokeStyle = color; g2.lineWidth = w; g2.lineCap = 'round';
  g2.beginPath(); g2.arc(cx, cy, R, a0, a1, ccwDir); g2.stroke(); const ex = cx + R * Math.cos(a1), ey = cy + R * Math.sin(a1), tg = a1 + (ccwDir ? -1 : 1) * Math.PI / 2;
  g2.fillStyle = color; g2.beginPath(); g2.moveTo(ex + 30 * Math.cos(tg), ey + 30 * Math.sin(tg)); g2.lineTo(ex + 20 * Math.cos(tg + 2.2), ey + 20 * Math.sin(tg + 2.2)); g2.lineTo(ex + 20 * Math.cos(tg - 2.2), ey + 20 * Math.sin(tg - 2.2)); g2.closePath(); g2.fill(); g2.restore(); }
function blinker(g2, a, on, x, y) { if (a <= 0) return; g2.save(); g2.globalAlpha = a; g2.fillStyle = 'rgba(8,10,14,0.88)'; S.rrect(g2, x - 120, y - 52, 240, 104, 22); g2.fill(); g2.strokeStyle = '#3a3f47'; g2.lineWidth = 4; g2.stroke();
  g2.translate(x, y); g2.fillStyle = on ? '#3dff6e' : '#2a3a2e'; if (on) { g2.shadowColor = '#3dff6e'; g2.shadowBlur = 30; }
  g2.beginPath(); g2.moveTo(58, 0); g2.lineTo(8, -38); g2.lineTo(8, -16); g2.lineTo(-58, -16); g2.lineTo(-58, 16); g2.lineTo(8, 16); g2.lineTo(8, 38); g2.closePath(); g2.fill(); g2.restore(); }
function wheelIcon(g2, a, x, y, R, th) { if (a <= 0) return; g2.save(); g2.globalAlpha = a; g2.fillStyle = 'rgba(8,10,14,0.8)'; g2.beginPath(); g2.arc(x, y, R + 22, 0, 7); g2.fill(); g2.translate(x, y); g2.rotate(-th);
  g2.strokeStyle = '#e8e8e8'; g2.lineWidth = 14; g2.beginPath(); g2.arc(0, 0, R, 0, 7); g2.stroke(); g2.lineWidth = 12; for (const s of [0, Math.PI, Math.PI / 2]) { g2.beginPath(); g2.moveTo(0, 0); g2.lineTo(R * Math.cos(s), R * Math.sin(s)); g2.stroke(); }
  g2.fillStyle = '#e8e8e8'; g2.beginPath(); g2.arc(0, 0, 18, 0, 7); g2.fill(); g2.strokeStyle = '#d8261c'; g2.lineWidth = 15; g2.beginPath(); g2.arc(0, 0, R, -Math.PI / 2 - 0.15, -Math.PI / 2 + 0.15); g2.stroke(); g2.restore(); }
function overlay(t) {
  const g2 = st.g2; S.vignette(g2, 0); const k = KK || kin(t); const th = k[1] * D2R, sig = k[4] > 0.5;
  { const fx = Math.max(0, 1 - Math.abs(t - T.hookEnd) / 0.12); K.TXT.flash(g2, 0.75 * fx); }
  const hk = t < 4 ? 1 - S.smooth((t - (T.vo1 - 0.3)) / 0.3) : 0;
  const blinkOn = sig && ((t * 1.6) % 1) < 0.55;
  if (hk > 0) { K.TXT.hook(g2, hk, 'WHO TURNS', 'THE BLINKER OFF?', 104); const [cx0, cy0] = wpt(FG, 0, -4, 0); K.TXT.circle(g2, hk * (t < T.hookEnd ? 1 : 0), cx0, cy0, 70, [-230, 230]); }
  // dash blinker lamp (always on screen until the payoff)
  blinker(g2, fade(t, -1, T.vo6 + 0.2, 0.3), blinkOn, 540, 1330);
  const s1 = fade(t, T.vo1 - 0.1, T.vo2 - 0.05), s2 = fade(t, T.vo2, T.vo3 - 0.05), s3 = fade(t, T.vo3, T.vo4 - 0.05), s4 = fade(t, T.vo4, T.vo5 - 0.05), s5 = fade(t, T.vo5, T.vo6 - 0.05);
  K.TXT.step(g2, s1, 1, 'A NOTCH HOLDS THE LEVER', 58);
  K.TXT.step(g2, s2, 2, 'A FINGER MEETS A BUMPY RING', 58);
  K.TXT.step(g2, s3, 3, 'TURN IN: THE FINGER FOLDS', 58);
  K.TXT.step(g2, s4, 4, "TURN BACK: IT CAN'T FOLD", 58);
  K.TXT.step(g2, s5, 5, 'THE LEVER GETS KNOCKED HOME', 56);
  // stalk up arrow during the flick
  { const a = fade(t, T.vo1 + 0.2, T.vo2 - 0.1, 0.25); if (a > 0) { const [sx, sy] = wpt(ACT, -205, 0, 0); S.forceArrow(g2, a, sx, sy + 70, sx, sy - 90, 16);
      S.tag(g2, fade(t, T.flick_b, T.vo1 + 1.1, 0.2), 'LEVER UP', ...wpt(ACT, -235, 0, 0), 60, 170, 50, '#ffffff');
      S.tag(g2, fade(t, T.vo1 + 1.8, T.vo2 + 0.6, 0.25), 'NOTCH', ...wpt(ACT, -15, 0, 5), 170, 190, 52, '#ffd21f'); } }
  { const a = fade(t, T.vo2 + 1.9, T.vo3 + 0.1, 0.25); if (a > 0) { S.tag(g2, a, 'FINGER', ...wpt(FG, 0, -6, 4), -330, -70, 52, '#ffd21f');
      S.tag(g2, fade(t, T.vo2 + 2.5, T.vo3 + 0.1, 0.25), 'BUMP', ...wpt(ROT, 33 * Math.cos(210 * D2R), 33 * Math.sin(210 * D2R), 6), -150, 170, 52, '#ffffff'); } }
  // wheel icon (what the steering wheel is doing) during the macro
  wheelIcon(g2, fade(t, T.vo2 + 1.7, T.vo5 + 1.5, 0.3), 200, 1170, 66, th);
  // direction arrows around the cam: CW (turn in), CCW (turn back), push arrow on the lever
  const [cx, cy] = scr(0, 0, 0), [ex] = scr(40, 0, 0); const RR = Math.abs(ex - cx);

  arcArrow(g2, fade(t, T.back_a, T.snap + 0.25, 0.2), cx, cy, RR * 1.05, -Math.PI * 0.2, -Math.PI * 0.8, true, '#ff7a1a', 12);
  { const a = fade(t, T.touch - 0.1, T.snap + 0.2, 0.2); if (a > 0) { const [fx, fy] = wpt(FG, 0, -9, 4); S.forceArrow(g2, a, fx + 120, fy + 10, fx + 12, fy - 4, 15);
      S.tag(g2, fade(t, T.touch + 0.3, T.snap + 0.2, 0.2), 'STOP: NO FOLD', ...wpt(FG, -2.6, -3.5, 4), -300, -150, 48, '#ffffff'); } }
  { const a = fade(t, T.turn_a + 0.6, T.turn_b, 0.25); if (a > 0) S.tag(g2, a, 'FOLDS', ...wpt(FG, 0, -8, 4), -320, -110, 52, '#ffd21f'); }
  K.TXT.answer(g2, fade(t, T.vo6 + 0.05, LOOP - 1.3, 0.3), 'TURNING BACK', 'KNOCKS THE LEVER HOME', 560);

await document.fonts.load('40px Anton');
