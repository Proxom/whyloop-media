      const E = elPts(96).map(p => dpt(...fw(p[0], p[1], s, th), yTop)); g2.save(); g2.globalAlpha = Math.min(1, (1 - ga) * 3); polyScr(g2, E); g2.strokeStyle = '#ffffff'; g2.lineWidth = 5; g2.stroke(); g2.restore();
      const pkA = Math.max(H(t, T.vo3 + 0.1, T.outside), 0); if (pkA > 0) { const P = PKP.map(p => dpt(...fw(p[0], p[1], s, th), yBot)); g2.save(); g2.globalAlpha = pkA; polyScr(g2, P);
        if (ah + ac < 0.05) { g2.fillStyle = 'rgba(40,30,0,0.35)'; g2.fill(); } g2.strokeStyle = '#ffd21f'; g2.lineWidth = 6; g2.stroke(); g2.restore(); } }
    S.tag(g2, H(t, T.vo1 + 0.9, T.vo2 + 0.1), 'TOP DISC', ...wpt(UP, -14 * SC, 4 * SC, 0), -170, -110, 50, '#ffffff');
    S.tag(g2, H(t, T.vo1 + 1.4, T.vo2 + 0.1), 'BOTTOM DISC', ...dpt(-18, -14, YI - 2 * SC), -120, 150, 50, '#ffffff');
    S.tag(g2, H(t, T.vo2 + 1.1, T.vo3 + 0.3), 'HOT', ...dpt(-5, -5.75), -190, 120, 54, '#ff5a3a');
    S.tag(g2, H(t, T.vo2 + 1.7, T.vo3 + 0.3), 'COLD', ...dpt(5, -5.75), 170, 120, 54, '#5aa8ff');
    S.tag(g2, H(t, T.vo2 + 2.4, T.vo3 + 0.3), 'WAY OUT', ...dpt(0, 14.5), 190, -120, 54, '#ffffff');
    { const [u, v] = fw(0, 12, s, th); S.tag(g2, H(t, T.vo3 + 0.5, T.vo4 + 0.4), 'POCKET', ...dpt(u, v, YI + 2), -250, -60, 54, '#ffd21f'); }
    S.tag(g2, H(t, T.vo3 + 2.0, T.vo4 - 0.05), 'HOLE SHUT BY CERAMIC', ...dpt(5, -6.5, YI + 4 * SC), 30, 170, 48, '#ffffff');
    S.tag(g2, H(t, T.hot_a + 0.5, T.cold_a + 0.1), 'MORE HOT', ...dpt(-5, -5.75), -170, 120, 54, '#ff5a3a');
    S.tag(g2, H(t, T.cold_a + 0.8, T.outside), 'MORE COLD', ...dpt(5, -5.75), 160, 120, 54, '#5aa8ff');
    // flow: open inlet -> up into the pocket -> across the pocket -> down the way-out slot
    if (ah + ac > 0.3) { const col = css(mixCol(ah, ac)); const yP = YI + 1;
      const mid1 = dpt(...fw(0, 4, s, th), yP), mid2 = dpt(...fw(0, 12.5, s, th), yP), out = dpt(0, 14.5, YI), outDn = [out[0], out[1] + 70];
      const fa = Math.min(1, (ah + ac) / 4);
      if (ah > 0.3) arrowPath(g2, fa * Math.min(1, ah / 3), [dpt(-4.5, -5.0, YI - 6), dpt(...fw(-1.5, 1.5, s, th), yP), mid1], '#ff7a5a', 10, t);
      if (ac > 0.3) arrowPath(g2, fa * Math.min(1, ac / 3), [dpt(4.5, -5.0, YI - 6), dpt(...fw(1.5, 1.5, s, th), yP), mid1], '#7ab8ff', 10, t);
      arrowPath(g2, fa, [mid1, mid2, out], col, 12, t); arrowPath(g2, fa, [out, outDn], col, 12, t); }
    spoutInset(g2, H(t, T.vo3 + 0.3, T.outside), ah, ac);
    leverInset(g2, H(t, T.vo4 + 0.1, T.outside), t, s, th);
  }
  K.TXT.answer(g2, H(t, T.vo6 + 0.05, LOOP - 1.2), 'ONE MOVING POCKET', 'TWO FIXED HOLES', 560);
  { const a = H(t, LOOP - 1.15, LOOP + 1); if (a > 0) { const text = 'FOLLOW → A NEW MACHINE EVERY DAY'; g2.save(); g2.globalAlpha = a; g2.font = '44px Anton'; const w = g2.measureText(text).width + 44, yy = 420;
    S.rrect(g2, S.CX - w / 2, yy - 34, w, 68, 16); g2.fillStyle = 'rgba(12,14,20,0.86)'; g2.fill(); g2.strokeStyle = '#ffffff'; g2.lineWidth = 4; g2.stroke();
    g2.fillStyle = '#fff'; g2.textAlign = 'center'; g2.textBaseline = 'middle'; g2.fillText(text, S.CX, yy + 2); g2.restore(); } }
}
